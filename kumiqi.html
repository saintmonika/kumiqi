    case 'clip-replay': { const p = findPost(id); if(p && p.clip && p.clip.type === 'terminal') playTerm(p.clip.lines); else { const sc = $('#screen-clip'); if(sc){ const c = sc.cloneNode(true); sc.replaceWith(c); } } break; }
    case 'blur-open': openBlur(); break;
    case 'blur-undo': if(draft){ draft.blurRects.pop(); drawBlur(); } break;
    case 'blur-done': finishBlur(); break;
    case 'blur-find': findPrivate(el); break;
    case 'blur-yes': if(draft && window.__found){ window.__found.forEach(i => draft.blurRects.push({x:Math.max(0, i.x - .01), y:Math.max(0, i.y - .01), w:Math.min(1, i.w + .02), h:Math.min(1, i.h + .02)})); window.__found = null; openBlur(); } break;
    case 'blur-no': window.__found = null; $('#blur-area').innerHTML = ''; break;
    case 'sample-conn': addSample(el.dataset.v); break;
    case 'organizer': openOrganizer(); break;
    case 'org-export': exportReport(); break;
    case 'wrapped': openWrapped(0); break;
    case 'wnav': openWrapped(wIx + (+el.dataset.d)); break;
    case 'wrapped-card': openCard(S.posts.filter(p => p.author === 'me' && p.kind === 'ship'), 'wrapped'); break;
    case 'gtab': guestTab = el.dataset.v; openGuest(); break;
    case 'get-app': toast('In the real thing, this opens the App Store.'); break;
    case 'end-event': S.eventEnded = !S.eventEnded; save(); render(); toast(S.eventEnded ? "Event ended. It's an album now, and new posts are closed." : 'Event reopened.'); break;
    case 'remove-post': S.posts = S.posts.filter(p => p.id !== id); save(); closeSheet(); render(); toast('Removed from the event.'); break;
    case 'crew': S.crew = id; save(); render(); break;
    case 'crew-go': S.crew = id; save(); go('crew'); break;
    case 'open': openPost(id); break;
    case 'open-from-letter': closeSheet(); openPost(id); break;
    case 'print': openPrint(id); break;
    case 'src': srcOpen = srcOpen === el.dataset.v ? null : el.dataset.v; render(); { const f = $('.src-panel input:not([type=file])'); if(f) f.focus(); } break;
    case 'snap': openSnap(); break;
    case 'letters': openLetters(); break;
    case 'theme': toggleTheme(); break;
    case 'tried': { const p = findPost(id); if(p && p.author !== 'me' && !p.tried.includes('me')){ p.tried.push('me'); save(); } break; }
    case 'pin': togglePin(id, +el.dataset.i); break;
    case 'send': sendLetter(id); break;
    case 'card': openCard([findPost(id)], 'one'); break;
    case 'week-card': openCard(myWeek().filter(p => p.kind === 'ship'), 'week'); break;
    case 'save-card': saveCardFull(); break;
    case 'cs-style': if(cardState){ cardState.style = el.dataset.v; $$('#cs-style button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === cardState.style)); const fw = $('#cs-feat-wrap'); if(fw) fw.hidden = cardState.style !== 'sheet'; const cn = $('#cs-note'); if(cn){ cn.textContent = CARD_ABOUT[cardState.style] || ''; cn.hidden = !CARD_ABOUT[cardState.style]; } renderCardBase(); } break;
    case 'cs-feat': if(cardState){ cardState.feat = +el.dataset.v; $$('#cs-feat button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === cardState.feat)); renderCardBase(); } break;
    case 'cs-bg': if(cardState){ cardState.bg = el.dataset.v; $$('#cs-bg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === cardState.bg)); renderCardBase(); } break;
    case 'stk-add': if(cardState){ cardState.stickers.push({k:el.dataset.k, x:25 + Math.random()*50, y:20 + Math.random()*55, s:1, r:Math.round(Math.random()*24 - 12)}); cardState.sel = cardState.stickers.length - 1; renderStickers(); } break;
    case 'stk-remove': if(cardState && cardState.sel >= 0){ cardState.stickers.splice(cardState.sel, 1); cardState.sel = -1; renderStickers(); } break;    case 'folder': toggleFolder(id); break;
    case 'fcolor': S.folderColors[el.dataset.p] = el.dataset.c; save(); render(); break;
    case 'do-print': doPrint(); break;
    case 'do-snap': doSnap(); break;
    case 'kind': if(draft){ const v = el.dataset.v, a = draft.add || 0, d = draft.del || 0;
        if(v === 'cut'){ draft.mark = 'cut'; if(draft.source === 'github'){ draft.stat = '−' + Math.max(d - a, d).toLocaleString(); draft.unit = 'lines cut'; } }
        else if(v === 'scrap'){ draft.mark = 'scrap'; }
        else { draft.mark = draft.auto && draft.auto.mark === 'tidy' ? 'tidy' : null; if(draft.source === 'github' && draft.unit === 'lines cut'){ draft.stat = '+' + a.toLocaleString(); draft.unit = 'lines'; } }
        $$('#pf-kind button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v)); const st = $('#pf-stat'), un = $('#pf-unit'); if(st) st.value = draft.stat; if(un) un.value = draft.unit;
        const kn = $('#pf-kind-note'); if(kn) kn.textContent = v === 'scrap' ? 'Stamped VOID. Say what you tried in the caption.' : v === 'cut' ? 'Deleting counts. It gets a cancel band.' : ''; updatePreview(); } break;
    case 'art': if(draft){ draft.art = el.dataset.v; syncSeg(); updatePreview(); } break;
    case 'ink': if(draft){ if(el.dataset.v === 'auto'){ draft.inkAuto = true; applyAutoInk(); } else { draft.inkAuto = false; draft.color = el.dataset.v; } syncSeg(); updatePreview(); } break;
    case 'rewrite': rewriteCaption(el); break;
    case 'close': closeSheet(); break;
    case 'reset': resetDemo(); break;
    case 'dismiss-note': S.noteHidden = true; save(); render(); break;
  }
});
$('#scrim').addEventListener('click', e => { if(e.target === e.currentTarget && Date.now() - stkDragEnd > 400) closeSheet(); });
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !$('#scrim').hidden){ closeSheet(); return; }
  const el = e.target.closest && e.target.closest('[role="button"][data-act]');
  if(el && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); el.click(); }
});
document.addEventListener('input', e => {
  if(e.target.id === 'iv-text'){ inviteEdited = true; return; }
  if(e.target.id === 'iv-name'){ if(!inviteEdited){ const wrap = e.target.closest('[data-crew]'), c = CREWS.find(x => x.id === wrap.dataset.crew); $('#iv-text').value = inviteText(e.target.value.trim().split(/\s+/)[0], c); } return; }
  if(!draft) return;
  if(e.target.id === 'pf-color'){ draft.inkAuto = false; draft.color = e.target.value; syncSeg(); updatePreview(); return; }
  if(e.target.id === 'pf-zoom' && draft.crop){ draft.crop.z = +e.target.value; updatePreview(); return; }
  const map = {'pf-title':'title', 'pf-cap':'caption', 'pf-stat':'stat', 'pf-unit':'unit', 'pf-try':'tryUrl', 'pf-project':'project'};
  const k = map[e.target.id]; if(!k) return;
  draft[k] = e.target.value; if(k === 'caption') draft.message = '';
  if(['title','stat','unit'].includes(k)) updatePreview();
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  if(f.dataset.form === 'gh') loadRepo($('#gh-repo').value);
  if(f.dataset.form === 'link'){ const v = $('#link-url').value.trim(); if(v) addLink(v); }
  if(f.dataset.form === 'letter') sendLetter(f.dataset.id);
  if(f.dataset.form === 'guest-join'){ const n = ($('#gp-name').value || '').trim().split(/\s+/)[0]; if(!n){ toast('Type your first name to join.'); return; } S.guestName = n.slice(0, 20); S.guestId = S.guestName + '#' + now().toString(36); save(); openGuest(); }
  if(f.dataset.form === 'guest-snap') guestPost('snap');
  if(f.dataset.form === 'hanko'){ const v = [...($('#hk-char').value || '').trim()][0]; if(!v){ toast('Type one character.'); return; } S.hanko = v; save(); render(); openBook('shop'); toast('Your seal is on every stamp now.'); }
  if(f.dataset.form === 'handle'){ const v = ($('#pr-handle').value || '').trim().toLowerCase().replace(/[^a-z0-9_.]/g, ''); if(!v){ toast('Letters, numbers, dots and underscores only.'); return; } S.handle = v.slice(0, 20); save(); openProfile(); toast('Username saved.'); }
  if(f.dataset.form === 'join-name'){ const n = ($('#jn-name').value || '').trim().split(/\s+/)[0]; if(!n){ toast('Type your first name to join.'); return; } joinCrew(n.slice(0, 20)); }
  if(f.dataset.form === 'join-account'){ const h = ($('#jn-handle').value || '').trim().toLowerCase().replace(/[^a-z0-9_.]/g, ''); if(!h){ toast('Pick a username.'); return; } joinState.handle = h; joinState.step = 'done'; openJoin(joinState.crew); toast('Account made.'); }
  if(f.dataset.form === 'guest-project') guestPost('project');
});
document.addEventListener('change', async e => {
  if(e.target.id === 'pf-folder' && draft){
    const inp = $('#pf-project');
    if(e.target.value === '__new'){ inp.hidden = false; inp.value = ''; inp.focus(); draft.project = ''; }
    else { inp.hidden = true; draft.project = e.target.value; }
    return;
  }
  const m = e.target.id && e.target.id.match(/^(pf|sn)-all$/);
  if(m){ $$(`input[name="${m[1]}-crew"]`).forEach(i => { if(i.dataset.kind !== 'event') i.checked = e.target.checked; }); return; }
  const n = e.target.name && e.target.name.match(/^(pf|sn)-crew$/);
  if(n){ const all = $(`#${n[1]}-all`); if(all) all.checked = $$(`input[name="${n[1]}-crew"]`).filter(i => i.dataset.kind !== 'event').every(i => i.checked); }
  if(e.target.id === 'shot-input'){ await addShots(e.target.files); e.target.value = ''; }
  if(e.target.id === 'sn-photo' && e.target.files[0]){ await setSnapPhoto(e.target.files[0]); e.target.value = ''; }
  if(e.target.id === 'gp-photo' && e.target.files[0]){ await setGuestPhoto(e.target.files[0]); e.target.value = ''; }
});
async function setSnapPhoto(file){
  if(!file.type.startsWith('image/')){ toast("That isn't an image."); return; }
  try{ snapDraft.image = await readImage(file, 900); const pv = $('#sn-preview'); if(pv){ pv.src = snapDraft.image; pv.hidden = false; } }catch(err){ toast("Couldn't read that photo."); }
}
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if(z){ e.preventDefault(); z.classList.add('is-over'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if(z) z.classList.remove('is-over'); });
document.addEventListener('drop', e => {
  const z = e.target.closest && e.target.closest('[data-drop]'); if(!z) return; e.preventDefault(); z.classList.remove('is-over');
  if(z.dataset.drop === 'snap'){ if(e.dataTransfer.files[0]) setSnapPhoto(e.dataTransfer.files[0]); }
  else if(z.dataset.drop === 'guest'){ if(e.dataTransfer.files[0]) setGuestPhoto(e.dataTransfer.files[0]); }
  else addShots(e.dataTransfer.files);
});
document.addEventListener('paste', e => {
  const items = [...((e.clipboardData && e.clipboardData.items) || [])].filter(i => i.type && i.type.startsWith('image/'));
  if(!items.length) return;
  if(!$('#scrim').hidden && snapDraft && $('#sn-photo')){ e.preventDefault(); setSnapPhoto(items[0].getAsFile()); return; }
  if(!$('#scrim').hidden && $('#gp-photo')){ e.preventDefault(); setGuestPhoto(items[0].getAsFile()); return; }
  if(S.view === 'tray' && $('#scrim').hidden){ e.preventDefault(); addShots(items.map(i => i.getAsFile())); }
});
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if(VIEWS.includes(v) && v !== S.view){ S.view = v; save(); render(); } });

(S.newCrews || []).forEach(c => { if(!CREWS.some(x => x.id === c.id)) CREWS.push(c); });
/* Laptop view for the public website: the app runs inside a phone, with a short guide beside it.
   Phones and the Claude preview get the app directly. Add ?frame to any address to preview it. */
const SHELL = window.top === window && !/[?&]embed\b/.test(location.search)
  && (location.hostname.endsWith('github.io') || /[?&]frame\b/.test(location.search)) && matchMedia('(min-width: 900px)').matches;
function buildShell(){
  document.documentElement.classList.add('shell');
  const el = document.createElement('div'); el.className = 'shell-wrap';
  el.innerHTML = `<section class="shell-copy">
      <div class="shell-brand">${MASCOT}<span>Kumiqi</span></div>
      <h1>Every ship gets a stamp.</h1>
      <p class="shell-lede">Your small crew sees what you shipped this week, as collectible stamps. No updates to write.</p>
      <p class="shell-k">Try this</p>
      <ol class="shell-try">
        <li>Post the welcome stamp, or open <b>Tray</b> and print a real commit.</li>
        <li>Open a friend's stamp and <b>ask for a change</b>. Watch them ship it.</li>
        <li>Go to <b>Album</b>, open the Backsight folder, tap the <b>Core loop</b> stamp, then <b>Make a share card</b>. Add stickers.</li>
        <li>Open the <b>stamp book</b>, next to the mail icon.</li>
        <li>Tap the beaver seven times.</li>
      </ol>
      <p class="shell-note">A prototype by Isabella. Everyone except you is a sample person; the Backsight stamps come from her real GitHub. Best on a phone.</p>
    </section>
    <div class="shell-phone"><iframe src="${esc(location.pathname + '?embed' + location.hash)}" title="The Kumiqi app"></iframe></div>`;
  document.body.appendChild(el);
}
if(SHELL){ buildShell(); return; }
const h0 = location.hash.slice(1); if(VIEWS.includes(h0)) S.view = h0;
render(); updateTokBadge();
if(!S.welcomed) setTimeout(openWelcome, 350);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if($('#scrim').hidden) render(); });
})();
</script>
</body></html>
