<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0}</style></head><body><title>Kumiqi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@600;700&display=swap">
<style>
/* Layout: one phone-width column of paper objects (stamps, postcards, folders, a stamp sheet) on a desk, tabs pinned to the bottom. */
:root{
  --desk:#EBEBE8; --desk-2:#E0E0DB; --surface:#F6F6F3; --raised:#FFFFFF;
  --ink:#17171A; --ink-2:#4E4E55; --ink-3:#85858B; --line:#D3D3CE;
  --paper:#FBFAF6; --paper-ink:#1B1B20; --paper-ink-2:#5B5A60; --sheet-line:#CFCCC2;
  --mustard:#E2B13C; --magenta:#D4378A; --sea:#2A7AA6; --vermilion:#E2513A; --moss:#4F8A57; --night:#2B2D42;
  --on-mustard:#2A1F06; --on-magenta:#FFFFFF; --on-sea:#FFFFFF; --on-vermilion:#FFFFFF; --on-moss:#FFFFFF; --on-night:#FFFFFF;
  --accent:#C62F7F; --on-accent:#FFFFFF;
  --drop:rgba(20,20,30,.13); --scrim:rgba(18,18,24,.42);
  --shadow:0 1px 1px rgba(20,20,30,.08), 0 10px 22px rgba(20,20,30,.09);
  /* Wix Madefor Display for names and titles, mincho on the stamps, a quiet gothic sans for everything else. */
  --font-display:"Wix Madefor Display",system-ui,-apple-system,"Segoe UI",sans-serif; --dw:600;
  --font-stamp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --font-body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mincho:var(--font-stamp);
  --col:480px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#111113; --desk-2:#1C1C20; --surface:#18181B; --raised:#212125;
    --ink:#F1F0EB; --ink-2:#BEBDB7; --ink-3:#85847F; --line:#303036;
    --paper:#F0EEE6; --paper-ink:#1B1B20; --paper-ink-2:#5B5A60; --sheet-line:#C9C5B9;
    --mustard:#E9BC4E; --magenta:#EE5AA6; --sea:#4A9BCB; --vermilion:#F0664C; --moss:#6AA672; --night:#4A4E73;
    --on-mustard:#211804; --on-magenta:#1C0613; --on-sea:#06131C; --on-vermilion:#1E0904; --on-moss:#07140A; --on-night:#FFFFFF;
    --accent:#F06AAE; --on-accent:#1C0613;
    --drop:rgba(0,0,0,.55); --scrim:rgba(0,0,0,.62);
    --shadow:0 1px 1px rgba(0,0,0,.5), 0 12px 26px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#111113; --desk-2:#1C1C20; --surface:#18181B; --raised:#212125;
  --ink:#F1F0EB; --ink-2:#BEBDB7; --ink-3:#85847F; --line:#303036;
  --paper:#F0EEE6; --paper-ink:#1B1B20; --paper-ink-2:#5B5A60; --sheet-line:#C9C5B9;
  --mustard:#E9BC4E; --magenta:#EE5AA6; --sea:#4A9BCB; --vermilion:#F0664C; --moss:#6AA672; --night:#4A4E73;
  --on-mustard:#211804; --on-magenta:#1C0613; --on-sea:#06131C; --on-vermilion:#1E0904; --on-moss:#07140A; --on-night:#FFFFFF;
  --accent:#F06AAE; --on-accent:#1C0613;
  --drop:rgba(0,0,0,.55); --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 1px rgba(0,0,0,.5), 0 12px 26px rgba(0,0,0,.45);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font:15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--desk)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.app{max-width:var(--col);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(120px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--desk);box-shadow:0 0 0 100vmax var(--desk);clip-path:inset(0 -100vmax);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:8px;font:var(--dw) 23px/1 var(--font-display)}
.blocky{width:30px;height:30px;flex:none}
.brand small{font:11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);align-self:flex-end;padding-bottom:3px}
.top-actions{display:flex;gap:2px}
.badge.badge-tok{background:var(--mustard);color:var(--on-mustard)}
.badge-tok:empty{display:none}
@media (max-width:370px){.brand small{display:none}.icon-btn{width:36px}}
.icon-btn{position:relative;width:40px;height:40px;display:grid;place-items:center;border:0;background:transparent;border-radius:9px;color:var(--ink);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--desk-2)}
.badge{position:absolute;top:4px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--on-accent);font:11px/17px var(--font-body);text-align:center}

.eyebrow{margin:0;font:12px/1.4 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
.view-head{display:grid;gap:6px;padding-block:8px 4px}
.view-head h1{font:var(--dw) 27px/1.2 var(--font-display)}
.lede{margin:0;color:var(--ink-2);max-width:60ch}
.muted{color:var(--ink-3)}
.small{font-size:13px}

/* Buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:7px;padding:10px 14px;font:500 14px/1.15 var(--font-body);background:var(--ink);color:var(--desk);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn-wide{width:100%;padding:13px 16px;font-size:15px}
.link-btn{border:0;background:none;padding:0;color:var(--accent);font:500 13px var(--font-body);cursor:pointer;text-decoration:underline;text-underline-offset:3px;justify-self:start}
input,textarea{width:100%;border:1.5px solid var(--line);background:var(--raised);color:var(--ink);border-radius:7px;padding:10px 12px;font:16px/1.4 var(--font-body)}
textarea{resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--ink-2)}
.field{display:grid;gap:8px;margin:0;border:0;padding:0;min-width:0}
.field > legend{margin-bottom:9px}
.custom{border-top:1px solid var(--line);padding-top:14px}
.custom > summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;font:500 15px/1.2 var(--font-body)}
.custom > summary::-webkit-details-marker{display:none}
.custom > summary span{font-size:13px;font-weight:400;color:var(--ink-3)}
.custom > summary::after{content:"+";font-size:22px;line-height:1;color:var(--ink-3)}
.custom[open] > summary::after{content:"−"}
.custom-body{display:grid;gap:20px;margin-top:18px}
.sw.sw-auto{width:auto;height:30px;border-radius:999px;padding:0 12px;font:500 13px/30px var(--font-body);background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.sw.sw-auto[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.sw-pick{position:relative;overflow:hidden;background:conic-gradient(#E2513A,#E2B13C,#4F8A57,#2A7AA6,#C62F7F,#E2513A)}
.sw-pick input{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);opacity:0;cursor:pointer;padding:0;border:0}
.crop-row{display:flex;gap:12px;align-items:center}
.crop-row input[type=range]{flex:1;padding:0;border:0;background:none;accent-color:var(--ink)}
.print-preview.can-drag{cursor:grab;touch-action:none}
.check.all-check{font-weight:500}
.field > label:not(.dropzone),.field > legend,.lbl{font:12px/1.3 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Avatars */
.av{display:inline-grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:var(--h);color:var(--hi);font:700 13px/1 var(--font-body)}
.av-sm{width:24px;height:24px;font-size:11px}
.av-xs{width:18px;height:18px;font-size:9.5px}

/* Crew folder */
.crew-tabs{display:flex;gap:4px;align-items:flex-end;margin-top:6px;padding-left:0;overflow-x:auto}
.crew-tab{border:0;cursor:pointer;background:color-mix(in srgb,var(--fc) 38%,var(--desk));color:var(--ink-2);font:500 13.5px/1 var(--font-body);padding:8px 14px 9px;border-radius:10px 10px 0 0;transition:padding .2s,background .2s;white-space:nowrap}
.crew-tab[aria-selected="true"]{background:var(--fc);color:var(--fc-ink);padding:11px 15px 12px}
.crew-folder{background:var(--fc);color:var(--fc-ink);border-radius:0 14px 14px 14px;padding:18px 16px 16px;display:grid;gap:14px;box-shadow:var(--shadow)}
.crew-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.crew-name{font:var(--dw) 31px/1.1 var(--font-display)}
.crew-kind{margin:6px 0 0;font:12px/1.3 var(--font-body);letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.streak{flex:none;display:grid;place-items:center;align-content:center;width:68px;height:68px;border-radius:50%;border:2px dashed currentColor;text-align:center;font:9.5px/1.15 var(--font-body);letter-spacing:.06em;text-transform:uppercase;transform:rotate(-9deg)}
.streak b{display:block;font:var(--dw) 24px/1 var(--font-display);letter-spacing:0}
.crew-mid{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.avs{display:flex}
.avs .av{margin-left:-7px;box-shadow:0 0 0 2px var(--fc)}
.avs .av:first-child{margin-left:0}
.crew-status{margin:0;font-weight:500;font-size:14px}
.crew-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn.on-folder{background:var(--fc-ink);color:var(--fc)}
.btn.on-folder.ghost{background:transparent;color:var(--fc-ink);box-shadow:inset 0 0 0 1.5px currentColor}
.ledger{list-style:none;margin:0;padding:12px 0 0;border-top:1.5px dashed currentColor;display:grid;gap:7px}
.ledger li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;font-size:14px}
.ledger .n{font:12px var(--font-body);letter-spacing:.03em}
.ledger-note{margin:0;font-size:12.5px;opacity:.8}
.note{margin:14px 0 0;display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-3)}
.note p{margin:0;flex:1}
.note .icon-btn{width:28px;height:28px;margin-top:-4px}

/* The wall */
.wall-head{margin-top:24px}
.wall{columns:2;column-gap:16px;margin-top:14px;isolation:isolate}
@media (max-width:360px){.wall{columns:1}}
.item{break-inside:avoid;margin:0 0 22px;display:grid;gap:7px}
.hit{display:block;cursor:pointer;transform:rotate(var(--tilt,0deg));transition:transform .25s ease;border-radius:2px}
.hit:hover{transform:rotate(0deg) translateY(-2px)}
.by{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);padding-left:4px;min-width:0}
.by-when{color:var(--ink-3)}
.by-r{margin-left:auto;flex:none;min-width:20px;padding:2px 5px;border:1px solid var(--line);border-radius:3px;text-align:center;font:11px/1.2 var(--font-body);color:var(--ink-2)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.is-new .hit{animation:drop .7s cubic-bezier(.2,1.3,.4,1) both}
.is-new .postmark{animation:thump .55s .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{0%{transform:translateY(-30px) rotate(-8deg) scale(1.08);opacity:0}100%{transform:rotate(var(--tilt,0deg));opacity:1}}
@keyframes thump{0%{transform:rotate(-14deg) scale(1.9);opacity:0}60%{opacity:.9}100%{transform:rotate(-14deg) scale(1);opacity:.72}}

/* Stamp */
.stamp{--r:5px;position:relative;display:block;width:100%;padding:calc(2*var(--r));color:var(--paper-ink);text-align:left;
  background:radial-gradient(var(--r),#0000 97%,var(--paper)) round calc(-1.5*var(--r)) calc(-1.5*var(--r))/calc(3*var(--r)) calc(3*var(--r)),
             linear-gradient(var(--paper) 0 0) no-repeat 50%/calc(100% - 3*var(--r)) calc(100% - 3*var(--r));
  filter:drop-shadow(0 1px 0 var(--drop)) drop-shadow(0 6px 10px var(--drop))}
.stamp-art{position:relative;aspect-ratio:var(--ar,4/5);overflow:hidden;background:var(--paper);box-shadow:inset 0 0 0 1px rgba(0,0,0,.07)}
.stamp-art svg,.stamp-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hanko{position:absolute;top:7px;left:7px;width:21px;height:21px;display:grid;place-items:center;background:#D8432F;color:#FBFAF6;font:700 12.5px/1 var(--font-mincho);border-radius:3px;transform:rotate(5deg);box-shadow:0 0 0 1.5px rgba(251,250,246,.9)}
.stamp-band{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding-top:7px}
.stamp-text{min-width:0;display:grid;gap:3px}
.stamp-title{font:600 13.5px/1.25 var(--font-mincho);color:var(--paper-ink);overflow-wrap:anywhere}
.stamp-meta{font:10px/1.2 var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--paper-ink-2)}
.stamp-denom{flex:none;text-align:right;line-height:1}
.stamp-denom b{display:block;font:800 21px/1 var(--font-stamp);color:var(--c);font-variant-numeric:tabular-nums}
.stamp-denom span{font:10px/1 var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--paper-ink-2)}
/* Cut and scrapped stamps: a cancellation band, or a VOID overprint like a misprinted stamp. */
.mark-cut{position:absolute;left:-30%;right:-30%;top:50%;height:22%;transform:translateY(-50%) rotate(-18deg);border-block:2.5px solid #D8432F;display:grid;place-items:center;pointer-events:none}
.mark-cut b{background:#FBFAF6;color:#D8432F;font:700 11px/1 var(--font-body);letter-spacing:.24em;padding:3px 4px 3px 7px;border-radius:2px}
.mark-void{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-18deg);border:3px double #D8432F;color:#D8432F;font:800 26px/1 var(--font-stamp);letter-spacing:.12em;padding:5px 6px 4px 10px;background:rgba(251,250,246,.55);pointer-events:none}
.stamp.is-scrap .stamp-art > svg,.stamp.is-scrap .stamp-art > img{filter:grayscale(.75) contrast(.9)}
.stamp.is-cut .stamp-denom b,.stamp.is-scrap .stamp-denom b{color:#D8432F}
.stamp-sm .mark-void{font-size:16px;border-width:2px;padding:3px 4px 2px 6px}
.stamp-sm .mark-cut b{font-size:8px;padding:2px 3px 2px 5px}
.stamp-lg .mark-void{font-size:36px}
.postmark{position:absolute;top:2px;right:-2px;width:72px;color:#2A2A35;opacity:.72;transform:rotate(-14deg);pointer-events:none;mix-blend-mode:multiply}
.stamp-sm{--r:3.5px}
.stamp-sm .stamp-title{font-size:11px}
.stamp-sm .stamp-meta{display:none}
.stamp-sm .stamp-denom b{font-size:15px}
.stamp-sm .stamp-denom span{font-size:8.5px}
.stamp-sm .hanko{width:15px;height:15px;font-size:9px;top:5px;left:5px}
.stamp-sm .postmark{width:48px}
.stamp-lg .stamp-title{font-size:16px}
.stamp-lg .stamp-denom b{font-size:28px}
.stamp-lg .postmark{width:92px}

/* Postcard (snaps) */
.postcard{position:relative;background-color:var(--paper);color:var(--paper-ink);padding:22px 14px 12px;box-shadow:0 1px 0 var(--drop),0 6px 12px var(--drop);
  background-image:repeating-linear-gradient(to bottom,transparent 0 23px,rgba(40,50,80,.10) 23px 24px);background-position:0 20px}
.postcard img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;margin-bottom:10px}
.tape{position:absolute;top:-9px;left:50%;width:58px;height:18px;transform:translateX(-50%) rotate(-4deg);background:var(--mustard);opacity:.62}
.pc-text{margin:0;font:500 15px/24px var(--font-body);color:var(--paper-ink);overflow-wrap:anywhere}
.pc-foot{display:block;margin-top:8px;font:10px/1.2 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--paper-ink-2)}

/* Tray */
.add-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.add-row .lbl{margin-right:2px}
.add-btn{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 13px;font:500 13.5px/1 var(--font-body);cursor:pointer}
.add-btn[aria-expanded="true"]{background:var(--ink);color:var(--desk);border-color:var(--ink)}
.src-panel{margin-top:12px}
.src{display:grid;gap:6px;margin:0}
.src-row{display:flex;gap:8px}
.src-row input{flex:1;min-width:0}
.src-note{margin:10px 0 0;font-size:12.5px;color:var(--ink-3)}
.btn.small{padding:8px 12px;font-size:13.5px}
.printed{margin-top:18px;font-size:14px;color:var(--ink-2)}
.printed summary{cursor:pointer;font-size:13px;color:var(--ink-3)}
.printed ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.printed li{display:flex;justify-content:space-between;gap:12px}
.printed li span{color:var(--ink-3);font-size:13px}
.dropzone{display:grid;place-items:center;align-content:center;text-align:center;gap:2px;padding:14px;border:1.5px dashed var(--line);border-radius:7px;color:var(--ink-2);cursor:pointer;font-size:13.5px;min-height:86px}
.dropzone b{font-weight:500;color:var(--ink)}
.dropzone.is-over{border-color:var(--accent);background:var(--desk-2)}
.proofs{display:grid;margin-top:14px;border-top:1px solid var(--line)}
.proof{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.proof-thumb{align-self:start;padding:6px;background:var(--paper);box-shadow:0 1px 2px var(--drop),0 4px 8px var(--drop);transform:rotate(-2deg)}
.proof-thumb .art{position:relative;aspect-ratio:4/5;overflow:hidden}
.proof-thumb svg,.proof-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.proof-body{min-width:0;display:grid;gap:4px;align-content:start}
.proof-title{font:var(--dw) 17px/1.3 var(--font-display)}
.proof-meta{margin:0;font-size:12.5px;color:var(--ink-3)}
.proof-cap{margin:2px 0 0;color:var(--ink-2);font-size:14px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.proof-actions{display:flex;align-items:center;gap:8px;margin-top:8px}
.empty{display:grid;justify-items:center;text-align:center;gap:8px;padding:28px 12px;color:var(--ink-2)}
.empty .blocky{width:56px;height:56px}

/* Sheet (modal) */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.sheet{position:relative;width:100%;max-width:540px;max-height:100%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:16px 16px 0 0;
  padding:22px max(18px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.scrim[hidden]{display:none}
@media (min-width:720px){.scrim{align-items:center;padding:24px}.sheet{border-radius:16px;max-height:92%}}
@keyframes up{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.sheet-x{position:absolute;top:10px;right:10px;z-index:2}
.sheet h2{font:var(--dw) 24px/1.25 var(--font-display);padding-right:40px}

/* Detail */
.detail{display:grid;gap:18px}
.detail-visual{width:min(290px,80%);margin:8px auto 0;transform:rotate(-1.5deg)}
.detail-info{display:grid;gap:12px}
.detail-visual.is-card{width:min(260px,72%)}
.detail-head{display:flex;gap:10px;align-items:center}
.detail-head h2{font:var(--dw) 22px/1.2 var(--font-display);padding-right:0}
.detail-meta{margin:2px 0 0;font-size:13px;color:var(--ink-3)}
.detail-cap{margin:0;font-size:16px}
.detail-info > .btn{justify-self:start}
.private{border:1.5px dashed var(--accent);border-radius:8px;padding:14px;display:grid;gap:12px}
.private-label{margin:0;font:11.5px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.private p{margin:0}
.letters{display:grid;gap:10px}
.letter{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:12px 12px 10px;background:var(--paper);color:var(--paper-ink);box-shadow:0 1px 2px var(--drop),0 4px 10px var(--drop)}
.letter p{margin:0}
.letter .from{font:700 13.5px var(--font-body)}
.letter .on{font:10.5px var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--paper-ink-2)}
.letter .txt{margin-top:3px;font-size:14.5px}
.letter-tools{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
.pin{border:1.5px solid var(--paper-ink);background:transparent;color:var(--paper-ink);border-radius:999px;padding:4px 10px;font:500 12.5px/1.2 var(--font-body);cursor:pointer}
.pin[aria-pressed="true"]{background:var(--paper-ink);color:var(--paper)}
.pinned-tag{font:10.5px var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--paper-ink-2)}
.open-from-letter{border:0;background:none;padding:0;color:var(--paper-ink);font:500 12.5px var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.write{display:grid;gap:8px}
.ask-check{justify-self:start;padding:6px 10px;font-size:13.5px}
.req-tag{display:inline-block;margin-left:8px;padding:2px 6px;border-radius:3px;background:#E2B13C;color:#2A1F06;font:500 10.5px/1.3 var(--font-body);letter-spacing:.04em;text-transform:uppercase;vertical-align:1px}
.req-tag.is-done{background:#4C8655;color:#FFFFFF}
.requests{display:grid;gap:10px;margin-top:18px}
.answers{display:grid;gap:8px}
.req-checks{display:grid;gap:8px}
.req-check{align-items:flex-start;line-height:1.4}
.req-check input{margin-top:3px}
.by{flex-wrap:wrap}
.by-guest{font-size:10.5px;line-height:1.3;padding:0 5px;border:1px solid var(--line);border-radius:3px;color:var(--ink-3)}
.av-more{margin-left:7px;align-self:center;font:500 13px/1 var(--font-body)}
.qr-card{flex:none;display:grid;justify-items:center;gap:4px;padding:6px 6px 5px;background:#FBFAF6;color:#17171A;border-radius:6px;font:500 10px/1 var(--font-body);letter-spacing:.08em;transform:rotate(3deg);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.qr{display:block;width:70px;height:70px}
.guestpage{display:grid;gap:12px}
.gp-bar{display:flex;align-items:center;gap:8px;margin-right:44px;padding:9px 12px;border-radius:9px;background:var(--desk-2);color:var(--ink-2);font:13px/1 var(--font-body);min-width:0;overflow:hidden;white-space:nowrap}
.gp-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--moss)}
.gp-keep{display:grid;gap:10px;padding:14px;border:1.5px dashed var(--accent);border-radius:8px}
.gp-keep p{margin:0}
.gp-keep .btn{justify-self:start}
.remove-btn{justify-self:start;color:var(--vermilion)}
.by-ans{font-size:11.5px;color:var(--accent);white-space:nowrap}
.write label{font-weight:700;font-size:14px}
.sent{display:grid;gap:8px}

/* Print */
.print{display:grid;gap:18px}
.print-preview{width:min(220px,64%);margin:4px auto 0;transform:rotate(-2deg)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--raised);border-radius:6px;padding:7px 12px;font:500 13.5px var(--font-body);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--desk)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:0;background:var(--sw);cursor:pointer;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4.5px var(--ink)}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.check{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border:1.5px solid var(--line);border-radius:7px;cursor:pointer;font-size:14px;background:var(--raised)}
.check input{width:auto;margin:0;accent-color:var(--ink)}
.snap-preview{display:block;width:120px;aspect-ratio:4/3;object-fit:cover;border-radius:4px}

/* Roll */
.countdown{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:4px}
.countdown b{font:var(--dw) 34px/1 var(--font-display);font-variant-numeric:tabular-nums}
.stampsheet{margin-top:16px;background:var(--paper);color:var(--paper-ink);padding:26px 10px 12px;box-shadow:var(--shadow);position:relative}
.selvage{position:absolute;top:8px;left:14px;right:14px;display:flex;justify-content:space-between;font:10px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--paper-ink-2)}
.cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.cell{padding:10px 8px;border-right:2px dotted var(--sheet-line);border-bottom:2px dotted var(--sheet-line);min-width:0;display:grid;place-items:center;min-height:150px}
.cell:nth-child(3n){border-right:0}
.cell:nth-last-child(-n+3){border-bottom:0}
.cell > *{width:100%}
.cell .postcard{padding:16px 8px 8px}
.cell .pc-text{font-size:11.5px;line-height:18px}
.cell .tape{width:36px;height:12px;top:-6px}
.cell-empty{font:10.5px/1.4 var(--font-body);color:var(--paper-ink-2);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.roll-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.crew-sheets{display:grid;gap:18px;margin-top:26px}
.mini{display:grid;gap:8px}
.mini-head{display:flex;align-items:center;gap:8px;font-weight:500}
.mini-row{display:flex;gap:12px;overflow-x:auto;padding:6px 4px 12px}
.mini-row > *{flex:0 0 100px}
.mini-row .postcard{padding:16px 8px 8px}
.mini-row .pc-text{font-size:11.5px;line-height:18px}
.mini-row .tape{width:36px;height:12px;top:-6px}

/* Album */
.folder{display:grid;grid-template-columns:116px minmax(0,1fr);align-items:center;margin-top:28px}
.folder-cover{position:relative;z-index:2;height:170px;border:0;cursor:pointer;background:var(--fc);color:var(--fc-ink);border-radius:5px 16px 16px 5px;padding:14px 12px;display:grid;align-content:end;gap:5px;text-align:left;transform:perspective(700px) rotateY(16deg);transform-origin:left center;box-shadow:var(--shadow);transition:transform .35s ease}
.folder-cover::before{content:"";position:absolute;top:-9px;left:12px;width:44px;height:14px;background:var(--fc);border-radius:6px 6px 0 0}
.folder-cover::after{content:"";position:absolute;left:12px;right:12px;bottom:52px;height:1.5px;background:currentColor;opacity:.25}
.folder.is-open .folder-cover{transform:perspective(700px) rotateY(24deg)}
.folder-name{font:var(--dw) 18px/1.15 var(--font-display);overflow-wrap:anywhere}
.folder-meta{font:10.5px/1.3 var(--font-body);letter-spacing:.04em;text-transform:uppercase;opacity:.8}
.folder-strip{display:flex;gap:12px;overflow-x:auto;padding:18px 10px 18px 26px;margin-left:-16px;background:color-mix(in srgb,var(--fc) 30%,var(--desk));border-radius:0 12px 12px 0;min-height:150px;align-items:center}
.strip-item{flex:0 0 112px;display:grid;gap:6px;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .35s;transition-delay:calc(var(--i)*60ms)}
.folder:not(.is-open) .strip-item{transform:translateX(-50px);opacity:0}
.strip-date{font:10.5px var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);text-align:center}
.fswatches{display:flex;gap:12px;justify-content:center;margin-top:16px}
.fswatches .sw{width:26px;height:26px;box-shadow:0 0 0 2px var(--desk),0 0 0 3.5px var(--line)}
.fswatches .sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--desk),0 0 0 4.5px var(--ink)}
.album-stats{margin:10px 0 0;text-align:center;font:12.5px var(--font-body);color:var(--ink-2);letter-spacing:.03em}
.album-snaps{margin-top:30px;display:grid;gap:10px}
.reset{display:flex;justify-content:center;margin-top:36px}

/* Share card */
.card-wrap{display:grid;gap:14px;justify-items:center}
.card-edit{display:grid;gap:20px}
.card-stage{position:relative;width:min(100%,290px);justify-self:center;aspect-ratio:9/16;box-shadow:var(--shadow);background:var(--desk-2);transition:opacity .2s}
.card-stage.is-busy{opacity:.55}
.card-stage .card-img{width:100%;height:100%;box-shadow:none}
.card-side{display:grid;gap:20px;min-width:0}
.stk-layer{position:absolute;inset:0;overflow:hidden}
.stk{position:absolute;max-width:none;cursor:grab;touch-action:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.stk.is-sel{outline:2px dashed var(--accent);outline-offset:3px}
.stk-x{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:var(--desk);font:600 16px/26px var(--font-body);cursor:pointer;padding:0;z-index:2}
.stk-pick{display:flex;flex-wrap:wrap;gap:8px}
.stk-pick button{width:66px;height:54px;overflow:hidden;border:1.5px solid var(--line);border-radius:8px;background:var(--raised);display:grid;place-items:center;cursor:pointer;padding:7px}
.stk-pick img{width:100%;height:100%;object-fit:contain;display:block;min-height:0}
.folder-pick select{width:100%;border:1.5px solid var(--line);background:var(--raised);color:var(--ink);border-radius:7px;padding:10px 12px;font:16px/1.4 var(--font-body)}
.card-img{display:block;width:min(100%,300px);box-shadow:var(--shadow);background:var(--desk-2);aspect-ratio:9/16}
.card-loading{display:grid;place-items:center;width:min(100%,300px);aspect-ratio:9/16;background:var(--desk-2);color:var(--ink-3);font:12px var(--font-body);letter-spacing:.06em;text-transform:uppercase}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--desk);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:calc(var(--col) - 32px);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 76px minmax(0,1fr) minmax(0,1fr);align-items:stretch;height:68px}
.tab{display:grid;justify-items:center;align-content:end;gap:5px;min-width:44px;border:0;background:none;color:var(--ink-3);cursor:pointer;padding:10px 0 12px;font:10.5px/1 var(--font-body);letter-spacing:.07em;text-transform:uppercase;position:relative}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:50%;width:18px;height:3px;transform:translateX(-50%);background:var(--vermilion);border-radius:0 0 3px 3px}
.snap-btn{--r:4px;justify-self:center;align-self:center;width:56px;height:56px;border:0;cursor:pointer;color:var(--desk);display:grid;place-items:center;transform:rotate(-6deg) translateY(-12px);transition:transform .2s;
  background:radial-gradient(var(--r),#0000 97%,var(--ink)) round calc(-1.5*var(--r)) calc(-1.5*var(--r))/calc(3*var(--r)) calc(3*var(--r)),
             linear-gradient(var(--ink) 0 0) no-repeat 50%/calc(100% - 3*var(--r)) calc(100% - 3*var(--r));
  filter:drop-shadow(0 4px 8px var(--drop))}
.snap-btn:hover{transform:rotate(0deg) translateY(-14px)}
.snap-btn .i{width:24px;height:24px}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);opacity:0;z-index:70;background:var(--ink);color:var(--desk);padding:10px 14px;border-radius:8px;font-size:14px;width:max-content;max-width:min(88vw,420px);transition:opacity .25s,transform .25s;pointer-events:none}
.toast.is-on{opacity:1;transform:translateX(-50%)}

/* Detail actions, clips */
.detail-actions{display:flex;gap:8px;flex-wrap:wrap}
.term{background:#121216;color:#E9E7E1;border-radius:10px;padding:14px 14px 16px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:220px;max-height:60vh;overflow:auto;box-shadow:var(--shadow)}
.term-bar{display:flex;gap:6px;margin-bottom:10px}
.term-bar i{width:10px;height:10px;border-radius:50%;background:#3A3A42}
.term pre{margin:0;font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}
.term .cmd{color:#F0C85A}
.term .caret{display:inline-block;width:7px;height:14px;background:#E9E7E1;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.screen-clip{position:relative;overflow:hidden;border-radius:10px;aspect-ratio:4/3;background:var(--desk-2);box-shadow:var(--shadow)}
.screen-clip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 6s ease-in-out infinite alternate}
.screen-clip .cursor{position:absolute;width:24px;height:24px;left:30%;top:72%;animation:cur 6s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.18) translate(-5%,-4%)}}
@keyframes cur{0%{left:30%;top:72%}45%{left:62%;top:42%;transform:scale(1)}52%{left:62%;top:42%;transform:scale(.8)}60%{transform:scale(1)}100%{left:46%;top:28%}}
.clip-row{display:flex;gap:8px;margin-top:12px}
/* Blur editor */
.blur-wrap{display:grid;gap:8px}
.blur-stage{position:relative;touch-action:none;cursor:crosshair;overflow:hidden;border-radius:4px;box-shadow:inset 0 0 0 1px var(--line);background:var(--desk-2);user-select:none}
.blur-stage canvas{display:block;width:100%;height:auto}
.blur-rect{position:absolute;border:2px dashed var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);pointer-events:none}
.blur-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.blur-found{display:grid;gap:10px;padding:12px;border:1.5px dashed var(--accent);border-radius:8px}
.blur-found p{margin:0}
/* Sample connections */
.me-qr{display:grid;justify-items:center;gap:6px;margin:14px 0 16px}
.me-qr .qr{width:180px;height:180px;padding:10px;background:#FBFAF6;border-radius:10px;box-shadow:var(--shadow)}
.me-handle{margin:6px 0 0;font:var(--dw) 22px/1.2 var(--font-display)}
.me-qr p{margin:0}
.iv-qr{display:flex;align-items:center;gap:14px;padding:12px;border:1.5px dashed var(--line);border-radius:8px}
.iv-qr .qr{width:84px;height:84px;flex:none}
.iv-qr p{margin:0}
#iv-text{width:100%;border:1.5px solid var(--line);background:var(--raised);color:var(--ink);border-radius:7px;padding:10px 12px;font:16px/1.4 var(--font-body);resize:vertical}
.join-head{background:var(--fc);color:var(--fc-ink);border-radius:10px;padding:16px;display:grid;gap:6px}
.join-head .crew-name{margin:0}
.join-head .crew-kind{margin:0;color:var(--fc-ink);opacity:.85}
.join-opts{display:flex;flex-wrap:wrap;gap:8px}
/* Snap papers */
.postcard.paper-graph{background-image:linear-gradient(rgba(42,91,166,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(42,91,166,.13) 1px,transparent 1px);background-size:12px 12px;background-position:0 0}
.postcard.paper-sticky{background:#F6E27A;color:#2A2410;box-shadow:0 1px 0 var(--drop),4px 8px 10px -4px var(--drop);border-radius:0 0 3px 18px/0 0 3px 6px}
.postcard.paper-sticky .tape,.postcard.paper-receipt .tape,.postcard.paper-ticket .tape,.postcard.paper-envelope .tape,.postcard.paper-polaroid .tape{display:none}
.postcard.paper-sticky .pc-text{color:#2A2410}
.postcard.paper-receipt{background:#FFFFFF;padding:12px 14px 20px;--zz:7px;-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50% / calc(2*var(--zz)) 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50% / calc(2*var(--zz)) 100%}
.postcard.paper-receipt .pc-text{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;line-height:20px;color:#2B2B30}
.rc-head{display:block;font:600 10px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.14em;color:#6B6B72;padding-bottom:8px;margin-bottom:8px;border-bottom:1.5px dashed #C9C9CC}
.postcard.paper-polaroid{background:#FFFFFF;padding:10px 10px 14px}
.postcard.paper-polaroid:not(:has(img))::before{content:"";display:block;aspect-ratio:4/3;margin-bottom:10px;background:radial-gradient(circle at 70% 30%,#F0C85A 0 12%,transparent 13%),linear-gradient(#3B3F63,#22243A)}
.postcard.paper-polaroid .pc-text{text-align:center}
.postcard.paper-ticket{background:#F3D9A4;color:#3A2A0E;padding:12px 14px 14px 30px;-webkit-mask:radial-gradient(circle 8px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 8px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 8px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 8px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.postcard.paper-ticket::after{content:"";position:absolute;left:20px;top:8px;bottom:8px;border-left:1.5px dashed rgba(58,42,14,.4)}
.postcard.paper-ticket .pc-text{color:#3A2A0E}
.tk-head{display:block;font:700 9.5px/1 var(--font-body);letter-spacing:.24em;color:#9A6B1E;margin-bottom:6px}
.postcard.paper-envelope{background:#DCC097;color:#3A2A14;padding-top:34px;background-image:linear-gradient(to bottom right,transparent 49%,rgba(58,42,20,.22) 50%,transparent 52%),linear-gradient(to bottom left,transparent 49%,rgba(58,42,20,.22) 50%,transparent 52%);background-size:50% 28px;background-position:left top,right top;background-repeat:no-repeat}
.postcard.paper-envelope .pc-text{color:#3A2A14}
.paper-pick{display:flex;flex-wrap:wrap;gap:8px}
.paper-pick button{display:grid;justify-items:center;gap:5px;border:1.5px solid var(--line);background:var(--raised);border-radius:8px;padding:8px 8px 7px;cursor:pointer;font:12px/1.2 var(--font-body);color:var(--ink-2);min-width:72px}
.paper-pick button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.paper-pick button.is-locked{color:var(--ink-3)}
.paper-pick button.is-locked .pp-sw{opacity:.45}
.paper-pick .lock{width:12px;height:12px;vertical-align:-2px;margin-right:2px}
.about{margin-top:8px;padding:12px 14px;border-radius:8px;background:var(--desk-2);text-align:left;width:100%}
.about p{margin:0;font:13.5px/1.5 var(--font-body);color:var(--ink-2)}
.about .about-k{font:11px/1.3 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.style-note{margin:8px 0 0;font:12.5px/1.45 var(--font-body);color:var(--ink-3)}
.postmark.glitch{filter:drop-shadow(2px 0 0 rgba(0,179,199,.85)) drop-shadow(-2px 0 0 rgba(224,69,139,.85));opacity:.9}
.q-slot{width:70%;aspect-ratio:4/5;display:grid;place-items:center;border:1.5px dashed var(--line);border-radius:4px;font:var(--dw) 28px/1 var(--font-display);color:var(--ink-3)}
.egg-detail.is-fresh .cl-big{animation:drop .6s cubic-bezier(.3,1.4,.5,1) both}
.brand{cursor:default;user-select:none}
.blocky.boop{animation:boop .25s ease}
@keyframes boop{50%{transform:scale(1.18) rotate(-6deg)}}
.pp-cost{font:600 11px/1 var(--font-body);color:var(--ink-3);margin-top:-2px}
.pp-sw{display:block;width:40px;height:28px;box-shadow:0 1px 3px var(--drop)}
.pp-sw.paper-notebook{background:var(--paper) repeating-linear-gradient(transparent 0 6px,rgba(40,50,80,.16) 6px 7px)}
.pp-sw.paper-graph{background:#FBFAF6;background-image:linear-gradient(rgba(42,91,166,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(42,91,166,.2) 1px,transparent 1px);background-size:6px 6px}
.pp-sw.paper-sticky{background:#F6E27A}
.pp-sw.paper-envelope{background:#DCC097 linear-gradient(to bottom right,transparent 48%,rgba(58,42,20,.3) 50%,transparent 53%) left top/50% 12px no-repeat}
.pp-sw.paper-receipt{background:#fff repeating-linear-gradient(transparent 0 5px,#ddd 5px 6px)}
.pp-sw.paper-polaroid{background:#fff;border:4px solid #fff;border-bottom-width:9px;box-shadow:0 1px 3px var(--drop),inset 0 0 0 20px #3B3F63}
.pp-sw.paper-ticket{background:#F3D9A4}
/* Stamp book */
.head-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.book-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-right:40px;margin-bottom:12px}
.book-head h2{padding:0!important}
.book-bal{display:flex;gap:6px}
.tok{font:600 12px/1 var(--font-body);padding:6px 9px;border-radius:999px;background:var(--mustard);color:var(--on-mustard)}
.tok-freeze{background:var(--vermilion);color:var(--on-vermilion)}
.rally{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rally-cell{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font:12px/1 var(--font-body);color:var(--ink-3)}
.rally-cell.is-on{border:0;background:var(--paper)}
.rally-cell svg{width:100%;height:100%;display:block}
.cl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.cl-item{display:grid;justify-items:center;gap:3px;border:0;background:none;cursor:pointer;padding:6px 2px;color:var(--ink);text-align:center}
.cl-art{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:4/5}
.cl-svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px var(--drop))}
.cl-item.is-locked .cl-svg,.cl-detail.is-locked .cl-svg{filter:grayscale(1) opacity(.28)}
.cl-art .lock,.cl-big .lock{position:absolute;width:22px;height:22px;stroke:var(--ink-2)}
.cl-name{font:600 12.5px/1.2 var(--font-body)}
.cl-rar{font:10.5px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.cl-detail{display:grid;justify-items:center;gap:10px;text-align:center}
.cl-big{position:relative;width:min(56%,210px);aspect-ratio:4/5;display:grid;place-items:center}
.cl-big .lock{width:36px;height:36px}
.cl-prog{width:min(80%,260px);height:8px;border-radius:999px;background:var(--desk-2);overflow:hidden}
.cl-prog i{display:block;height:100%;background:var(--accent);border-radius:999px}
.cl-got{margin:0;font:600 13px/1 var(--font-body);color:var(--moss)}
.shop{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.shop-row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.shop-prev{width:56px;height:56px;display:grid;place-items:center}
.shop-prev .cl-svg{width:auto;height:100%}
.shop-t{display:grid;gap:2px;min-width:0}
.shop-t b{font:600 14px/1.25 var(--font-body)}
.shop-t span{font:12.5px/1.3 var(--font-body);color:var(--ink-3)}
.hanko-prev{width:40px;height:40px;display:grid;place-items:center;background:#D8432F;color:#FBFAF6;font:700 22px/1 var(--font-mincho);border-radius:5px;transform:rotate(5deg)}
.paper-prev{width:52px;display:block}
.paper-prev .postcard{padding:12px 6px 6px;transform:scale(1);font-size:0}
.paper-prev .pc-text{font-size:10px;line-height:14px}
.paper-prev .rc-head,.paper-prev .tk-head{font-size:6px;margin-bottom:3px;padding-bottom:3px}
.paper-prev .tape{width:26px;height:9px;top:-5px}
.welcome{display:grid;gap:12px;justify-items:center;text-align:center;padding-top:6px}
.welcome-stamp{width:min(62%,230px);transform:rotate(-3deg);margin:4px 0 8px}
.welcome .lede{margin:0;max-width:30ch}
.welcome-btns{display:grid;gap:8px;width:100%;margin-top:6px;justify-items:center}
.after-card{margin-top:18px;padding:16px;border:1.5px dashed var(--mustard);border-radius:10px;display:grid;gap:8px}
.after-card .eyebrow{margin:0}
.after-t{margin:0;font:var(--dw) 18px/1.3 var(--font-display)}
.after-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.saved-ev{display:grid;gap:4px;width:100%;text-align:left;border:0;cursor:pointer;background:var(--fc);color:var(--fc-ink);border-radius:10px;padding:14px 16px}
.saved-ev b{font:var(--dw) 18px/1.2 var(--font-display)}
.saved-ev span{font:12px/1.3 var(--font-body);letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.checks{display:grid;gap:6px}
.snap-preview[hidden]{display:none}
.sample-tag{font:500 10px/1 var(--font-body);letter-spacing:.06em;padding:3px 6px;border-radius:4px;border:1px solid var(--line);color:var(--ink-3);margin-left:6px;vertical-align:middle}
.mock-conn{display:grid;gap:10px;padding:14px;border:1.5px dashed var(--line);border-radius:8px}
.mock-conn p{margin:0;font-size:14px;color:var(--ink-2)}
.mock-conn .btn{justify-self:start}
.sample-tag{display:inline-block;margin-left:6px;padding:0 5px;border:1px solid var(--line);border-radius:3px;font-size:10.5px;line-height:1.4;color:var(--ink-3);vertical-align:1px}
/* Organizer view */
.org-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.org-stat{padding:12px 14px;border-radius:8px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.org-stat b{display:block;font:var(--dw) 28px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.org-stat span{font-size:12.5px;color:var(--ink-3)}
.org-list{list-style:none;margin:0;padding:0;display:grid}
.org-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.org-list .t{font-weight:500;overflow-wrap:anywhere}
.org-list .m{font-size:12.5px;color:var(--ink-3)}
.org-list a{font-size:13.5px;color:var(--accent);font-weight:500}
/* Wrapped */
.wrapped{display:grid;gap:14px;margin-top:34px}
.wslide{min-height:330px;border-radius:14px;padding:22px 20px 20px;display:grid;align-content:space-between;gap:18px;background:var(--fc);color:var(--fc-ink);animation:up .3s ease}
.w-k{margin:0;font:500 12px/1.3 var(--font-body);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.w-big{font:var(--dw) 60px/1 var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.w-big.is-name{font-size:42px;line-height:1.05}
.w-line{margin:8px 0 0;font:var(--dw) 21px/1.25 var(--font-display);text-wrap:balance}
.w-sub{margin:0;font-size:15px;opacity:.9}
.wnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wdots{display:flex;gap:6px}
.wdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.wdots i.on{background:var(--ink)}
.view-head .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- art ---------- */
function patternSVG(kind, ink, paper, size){
  const id = 'pt' + (++uid);
  const open = size
    ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="${size.w}" height="${size.h}" preserveAspectRatio="xMidYMid slice">`
    : `<svg viewBox="0 0 120 90" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">`;
  let body = '';
  if(kind === 'sun'){
    let bars = '';
    for(let y = 49; y <= 64; y += 5) bars += `<rect x="30" y="${y}" width="60" height="2.2" fill="${paper}"/>`;
    body = `<rect width="120" height="90" fill="${paper}"/><circle cx="60" cy="44" r="24" fill="${ink}"/>${bars}`
      + `<path d="M0 73 C20 65 40 65 60 73 S100 81 120 73 V90 H0 Z" fill="${ink}" opacity=".88"/>`
      + `<path d="M0 81 C20 75 40 75 60 81 S100 87 120 81" fill="none" stroke="${paper}" stroke-width="1.6"/>`;
  } else if(kind === 'blocks'){
    let r = '';
    for(let j = 0; j < 6; j++) for(let i = 0; i < 8; i++){
      const x = i*15, y = j*15, o = (((i*7 + j*3) % 5) / 10 + .5).toFixed(2);
      r += (i + j) % 2
        ? `<rect x="${x+5.5}" y="${y+2}" width="4" height="11" rx="1" fill="${ink}" opacity="${o}"/>`
        : `<rect x="${x+2}" y="${y+5.5}" width="11" height="4" rx="1" fill="${ink}" opacity="${o}"/>`;
    }
    body = `<rect width="120" height="90" fill="${paper}"/>${r}`;
  } else {
    const ring = (cx, cy) => `<circle cx="${cx}" cy="${cy}" r="9.6"/><circle cx="${cx}" cy="${cy}" r="6.6"/><circle cx="${cx}" cy="${cy}" r="3.6"/>`;
    body = `<defs><pattern id="${id}" width="20" height="10" patternUnits="userSpaceOnUse"><g fill="${paper}" stroke="${ink}" stroke-width="1.25">`
      + ring(0,-5) + ring(20,-5) + ring(10,0) + ring(0,5) + ring(20,5) + ring(10,10) + ring(0,15) + ring(20,15)
      + `</g></pattern></defs><rect width="120" height="90" fill="${paper}"/><rect width="120" height="90" fill="url(#${id})"/>`;
  }
  return open + body + '</svg>';
}
function postmarkSVG(t){

  return `<svg class="postmark" viewBox="0 0 120 80" aria-hidden="true" focusable="false"><defs>`
    + `<path id="${id}a" d="M23 40 a23 23 0 1 1 46 0"/><path id="${id}b" d="M17.5 40 a28.5 28.5 0 0 0 57 0"/></defs>`
    + `<g fill="none" stroke="currentColor"><circle cx="46" cy="40" r="32" stroke-width="2.2"/><circle cx="46" cy="40" r="17" stroke-width="1.3"/>`
    + `<path d="M82 24c5-4 10 4 15 0s10 4 15 0M82 36c5-4 10 4 15 0s10 4 15 0M82 48c5-4 10 4 15 0s10 4 15 0M82 60c5-4 10 4 15 0s10 4 15 0" stroke-width="2.2"/></g>`
    + `<g fill="currentColor" font-family="Zen Kaku Gothic New, system-ui, sans-serif" font-weight="500">`
    + `<text font-size="9" letter-spacing="2"><textPath href="#${id}a" startOffset="50%" text-anchor="middle">KUMIQI</textPath></text>`

function inkOf(p){ return INKS[p.color] || (/^#[0-9a-f]{6}$/i.test(p.color || '') ? p.color : INKS.sea); }
function stampAR(p){ return p.art === 'image' && p.image ? '4/3' : ARS[hash(p.id) % ARS.length]; }
function stampHTML(p, opts={}){

/* Picks an ink from the screenshot's strongest color, darkened enough to read on stamp paper. */
async function dominantInk(src){
  const im = await loadImg(src), c = document.createElement('canvas'); c.width = c.height = 40;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0, 40, 40);
  const d = g.getImageData(0, 0, 40, 40).data, buckets = {};
  for(let i = 0; i < d.length; i += 4){
    const r = d[i], gg = d[i+1], b = d[i+2], mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
    if(mx < 60 || (mx - mn) / mx < .28) continue;
    const k = (r >> 5) + ',' + (gg >> 5) + ',' + (b >> 5), e = buckets[k] || (buckets[k] = {n:0, r:0, g:0, b:0});
    e.n++; e.r += r; e.g += gg; e.b += b;
  }
  const best = Object.values(buckets).sort((a,b) => b.n - a.n)[0]; if(!best) return null;
  let [r, gg, b] = [best.r / best.n, best.g / best.n, best.b / best.n];
  const lum = (.2126*r + .7152*gg + .0722*b) / 255, f = lum > .42 ? .42 / lum : 1;
  return '#' + [r*f, gg*f, b*f].map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
}

function doPrint(){
  if(!draft) return;
  const crews = $$('input[name="pf-crew"]:checked').map(i => i.value);
  if(!crews.length){ toast('Pick at least one crew to post to.'); return; }
  if(!draft.title.trim()){ toast('Give the stamp a title.'); $('.custom').open = true; $('#pf-title').focus(); return; }
  let tryUrl = draft.tryUrl.trim();
  if(tryUrl && !/^https?:\/\//i.test(tryUrl)) tryUrl = 'https://' + tryUrl;
  const reqIds = $$('input[name="pf-req"]:checked').map(i => i.value), answers = [];
  S.posts.forEach(q => q.letters.forEach(l => { if(reqIds.includes(l.id)){ l.answeredBy = draft.id; answers.push({from:l.from, text:l.text, postId:q.id}); } }));
  const p = normalize({id:draft.id, author:'me', crews, kind:'ship', title:draft.title.trim(), caption:draft.caption.trim(), stat:draft.stat.trim(), unit:draft.unit.trim(), mark:draft.mark || null,
    source:draft.source, ref:draft.ref, add:draft.add, del:draft.del, files:draft.files, art:draft.art, color:draft.color, image:draft.image || null,
    project:(draft.project || 'Side project').trim(), at:now(), tryUrl:tryUrl || null, answers, crop:draft.image && draft.crop ? Object.assign({}, draft.crop) : null,
    clip: draft.clip && (draft.clip.type === 'terminal' || draft.image) ? draft.clip : null});
  S.posts.unshift(p); checkEggs(p);
  if(!S.printed.includes(draft.trayId)) S.printed.push(draft.trayId);
  S.crew = crews[0]; save();
  const btn = $('#pf-go'); btn.disabled = true; btn.textContent = 'Printing…';
  const pv = $('#print-preview');
  pv.innerHTML = stampHTML(p); pv.classList.add('is-new');
  const pm = pv.querySelector('.postmark'); if(pm) pm.style.animation = 'thump .55s cubic-bezier(.3,1.6,.5,1) both';
  const crewNames = crews.map(id => CREWS.find(c => c.id === id).name);
  const got = earnTokens(2 + (answers.length ? 3 : 0)); save();
  const askers = [...new Set(answers.map(a => a.from))];
  setTimeout(() => {
    closeSheet(); justPosted = p.id; go('crew');
    if(askers.length){ toast(`Printed. ${names(askers)} ${askers.length === 1 ? 'gets' : 'get'} told: you asked, Isabella shipped it.${got}.`); thankYou(p.id, askers[0]); }
    else { toast('Printed and posted to ' + crewNames.join(' and ') + '.' + got + '.'); simulateCrew(p.id); }
  }, 900);
  draft = null;
}
function addLetter(p, l){ p.letters.push(Object.assign({pinned:false, seen:false, at:now(), type:'note', id:p.id + '-l' + p.letters.length}, l)); }
function simulateCrew(pid){
  setTimeout(() => { const p = findPost(pid); if(!p) return;
    if(p.kind === 'ship') addLetter(p, {from:'maya', type:'request', text:'Wait, this is so good. Could it send me a link to the run that failed?'});
    else addLetter(p, {from:'maya', text:'Ha. Same energy tonight.'});
    if(p.tryUrl && !p.tried.includes('maya')) p.tried.push('maya');
    save(); updateBadge(); toast(p.kind === 'ship' ? 'Maya sent a request' : 'New letter from Maya'); }, 7000);
}
function thankYou(pid, from){
  setTimeout(() => { const p = findPost(pid); if(!p) return;
    addLetter(p, {from, text:'Wait, you actually shipped it. Trying it right now.'});
    if(p.tryUrl && !p.tried.includes(from)) p.tried.push(from);
    save(); updateBadge(); toast('New letter from ' + who(from)); }, 6000);
}

function qrSVG(seed){
  const fin = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#FBFAF6"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  let r = '';
  for(let y = 0; y < 21; y++) for(let x = 0; x < 21; x++){
    if((x < 8 && y < 8) || (x > 12 && y < 8) || (x < 8 && y > 12)) continue;
    if(hash(seed + ':' + x + ',' + y) % 2) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg class="qr" viewBox="-1 -1 23 23" aria-hidden="true" focusable="false"><rect x="-1" y="-1" width="23" height="23" fill="#FBFAF6"/><g fill="#17171A">${r}${fin(0,0)}${fin(14,0)}${fin(0,14)}</g></svg>`;
}

function collectSVG(it){
  if(it.fam === 'char') return charSVG(it);
  if(it.fam === 'misprint') return charSVG(it, {misprint:true});
  if(it.fam === 'passport') return passportSVG();
  if(it.fam === 'backforgood') return backSVG();
  if(it.fam === 'due') return dueSVG(S.freezes || 0);
  if(it.fam === 'season') return seasonSVG();
  return ekiSVG(it.ink, it.label, 'NOV 1–2 · 2026', it.icon);
}

function buy(key, cost){
  if(owned(key)) return;
  if(tokens() < cost){ toast(`You need ${cost - tokens()} more tokens.`); return; }
  S.tokens = tokens() - cost; S.owned = Object.assign({}, S.owned, {[key]:true}); save(); updateTokBadge();
  const name = key === 'hanko' ? 'Your own hanko' : key.startsWith('paper:') ? (PAPERS.find(p => 'paper:' + p.id === key) || {}).name : (COLLECT.find(c => c.id === key) || {}).name;
  if(COLLECT.some(c => c.id === key)) openCollect(key); else openBook('shop');
  toast(`${name} is yours.`);
}

function eggFound(id){ return !!(S.eggs && S.eggs[id]); }
function findEgg(id, delay = 0){
  if(eggFound(id)) return false;
  S.eggs = Object.assign({}, S.eggs, {[id]:now()}); earnTokens(5); save();
  setTimeout(() => openEgg(id, true), delay);
  return true;
}
function openEgg(id, fresh){

  openSheet(`${fresh ? '' : '<button class="link-btn" data-act="book" style="margin-bottom:6px">Back to the book</button>'}

function secretsHTML(){

/* Which secrets did this post just unlock? Returns the first one found so the reveal shows once. */
function checkEggs(p, when){
  const d = when || new Date(), found = [];
  if(d.getHours() === 4 && d.getMinutes() === 4){ p.egg = '404'; if(!eggFound('404')) found.push('404'); }
  if(/hello,?\s*world/i.test((p.caption || '') + ' ' + (p.text || '') + ' ' + (p.title || '')) && !eggFound('hello')) found.push('hello');
  if(p.kind === 'ship'){
    if(d.getDay() === 5 && d.getHours() >= 17 && !eggFound('friday')) found.push('friday');
    if((p.add === 1337 || String(p.stat).replace(/[^\d]/g, '') === '1337') && !eggFound('leet')) found.push('leet');
    const wk = S.posts.filter(q => q.author === 'me' && q.kind === 'ship' && isThisWeek(q.at));
    const add = wk.reduce((a, q) => a + (q.add || 0), 0), del = wk.reduce((a, q) => a + (q.del || 0), 0);
    if(del > add && del > 0 && !eggFound('slate')) found.push('slate');
  }
  found.forEach((id, i) => { S.eggs = Object.assign({}, S.eggs, {[id]:now()}); earnTokens(5); });
  if(found.length){ save(); setTimeout(() => openEgg(found[0], true), 1700); }
  return found;
}

async function loadRepo(slug){
  slug = slug.trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/, '').replace(/\/+$/, '');

    if(!r.ok){ const err = new Error('http'); err.status = r.status; throw err; }
    const list = await r.json();
    const details = await Promise.all(list.map(c => fetch(c.url).then(x => x.ok ? x.json() : null).catch(() => null)));
    const items = list.map((c, i) => {
      const d = details[i] || {}, msg = (c.commit.message || '').split('\n')[0];
      return ghItem({sha:c.sha.slice(0,7), at:Date.parse(c.commit.author.date), message:msg, title:shortTitle(msg), caption:msg,
        add:(d.stats && d.stats.additions) || 0, del:(d.stats && d.stats.deletions) || 0, files:(d.files || []).length}, slug);
    });

    save(); setNote(`Pulled ${items.length} ${items.length === 1 ? 'commit' : 'commits'} from ${slug} just now.`);
    render();
  }catch(e){
    if(e.status === 404) setNote("Couldn't find that repo. Check the spelling and make sure it's public.");
    else if(e.status === 403) setNote("GitHub's hourly limit for this network is used up. Try again in an hour.");

      ? "This link can't reach GitHub, so it's showing a saved copy. Open Kumiqi.html on your computer to pull live."

}
function shortTitle(m){

function readImage(file, max=1000){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => {
      const s = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas'); c.width = Math.round(im.width*s); c.height = Math.round(im.height*s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .84)); }; im.src = fr.result; };
    fr.readAsDataURL(file);

}

/* ---------- free, on-device fallbacks (used outside Claude) ---------- */
const VERB_PAST = {add:'Added', adds:'Added', fix:'Fixed', fixes:'Fixed', remove:'Removed', removes:'Removed', delete:'Deleted', update:'Updated', updates:'Updated',
  improve:'Improved', refactor:'Cleaned up', clean:'Cleaned up', implement:'Built', build:'Built', create:'Made', make:'Made', use:'Now uses', support:'Now supports',
  bump:'Updated', rename:'Renamed', move:'Moved', speed:'Sped', handle:'Now handles', allow:'Now allows', let:'Now lets', show:'Now shows', hide:'Hid', ship:'Shipped', launch:'Launched', redesign:'Redesigned'};
const JARGON = [[/\brepo\b/gi, 'project'], [/\bUI\b/g, 'screens'], [/\bUX\b/g, 'experience'], [/\bauth\b/gi, 'login'], [/\bdeps\b/gi, 'libraries'], [/\bdependencies\b/gi, 'libraries'],
  [/\bAPI\b/g, 'connection'], [/\bendpoint(s?)\b/gi, 'connection$1'], [/\bDB\b/g, 'database'], [/\bconfig\b/gi, 'settings'], [/\bperf\b/gi, 'speed'], [/\bimpl\b/gi, 'version'], [/\bWIP\b/g, 'in progress']];
function plainWords(src){
  let t = String(src || '').split('\n')[0].trim();
  const pre = (t.match(/^(feat|fix|chore|refactor|docs|style|perf|test|tests|build|ci|wip)(\([^)]*\))?!?:/i) || [])[1];
  t = t.replace(/^(feat|fix|chore|refactor|docs|style|perf|test|tests|build|ci|wip)(\([^)]*\))?!?:\s*/i, '').replace(/\s*\(#\d+\)\s*$/, '').replace(/[.!]+$/, '');
  JARGON.forEach(([re, w]) => { t = t.replace(re, w); });
  const m = t.match(/^(\w+)\b(.*)$/);
  if(m && VERB_PAST[m[1].toLowerCase()]) t = VERB_PAST[m[1].toLowerCase()] + m[2];
  else if(pre){ const lead = {fix:'Fixed:', feat:'Added', perf:'Speed boost:', refactor:'Cleaned up', docs:'Docs:', test:'Tests:', tests:'Tests:'}[pre.toLowerCase()];
    if(lead) t = lead + ' ' + (/^[A-Z]{2}/.test(t) ? t : t.charAt(0).toLowerCase() + t.slice(1)); }
  const words = t.split(/\s+/).filter(Boolean); if(words.length > 18) t = words.slice(0, 18).join(' ') + '…';
  t = t.charAt(0).toUpperCase() + t.slice(1);
  return t && !/[….!?]$/.test(t) ? t + '.' : t;
}
/* Find private info by reading the screenshot's text on this device. The image never leaves it. */
let tessLoading = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(!tessLoading) tessLoading = new Promise((ok, no) => {
    const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js';
    sc.onload = () => window.Tesseract ? ok(window.Tesseract) : no(new Error('tesseract'));
    sc.onerror = () => { tessLoading = null; no(new Error('tesseract')); };
    document.head.appendChild(sc);
  });
  return tessLoading;
}
const PRIV = {
  email:/[^\s@]+@[^\s@]+\.[a-z]{2,}/i,
  key:/^(sk-|sk_live|sk_test|pk_live|rk_live|ghp_|gho_|github_pat_|AKIA|AIza|xox[abpr]-|eyJ)[A-Za-z0-9_\-.]{6,}/,
  longToken:/^[A-Za-z0-9_\-]{28,}$/,
  phone:/(\+?\d[\d\s().\-]{8,}\d)/,
  address:/\b\d{1,5}\s+(?:[A-Z][a-z]+\s){1,3}(?:St|Street|Ave|Avenue|Rd|Road|Blvd|Dr|Drive|Ln|Lane|Way|Ct|Court|Pl|Place)\b/,
  secretWord:/\b(password|passwd|pwd|secret|token|api[_ ]?key)\b\s*[:=]/i,
  card:/\b(?:\d[ -]?){13,16}\b/
};
async function localFindPrivate(src){
  const T = await loadTesseract();
  const img = await loadImg(src), W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
  const worker = await T.createWorker('eng');
  let data;
  try{ ({data} = await worker.recognize(src)); } finally { try{ await worker.terminate(); }catch(e){} }
  const out = [], box = (b, label) => out.push({label, x:b.x0 / W, y:b.y0 / H, w:(b.x1 - b.x0) / W, h:(b.y1 - b.y0) / H});
  const words = data.words || [];
  words.forEach(w => {
    const t = (w.text || '').trim(); if(!t) return;
    if(PRIV.email.test(t)) box(w.bbox, 'an email address');
    else if(PRIV.key.test(t) || (PRIV.longToken.test(t) && /\d/.test(t) && /[a-z]/i.test(t))) box(w.bbox, 'what looks like a key or token');
  });
  (data.lines || []).forEach(l => {
    const t = (l.text || '').trim(), lw = (l.words || []);
    if(PRIV.card.test(t)) box(l.bbox, 'what looks like a card number');
    else if(PRIV.phone.test(t) && (t.match(/\d/g) || []).length >= 9) lw.filter(w => /\d{2,}/.test(w.text)).forEach(w => box(w.bbox, 'a phone number'));
    if(PRIV.address.test(t)) box(l.bbox, 'a street address');
    if(PRIV.secretWord.test(t)){ const i = lw.findIndex(w => /[:=]$/.test(w.text) || PRIV.secretWord.test(w.text)); lw.slice(i + 1).forEach(w => box(w.bbox, 'a password or secret')); }
  });
  return out.filter(i => [i.x, i.y, i.w, i.h].every(v => isFinite(v) && v >= 0 && v <= 1));
}

/* One big featured stamp up top, the rest in a row underneath, like a real souvenir sheet. */
async function drawSheetFeatured(g, list, x, y, w, maxH, label, title, feat){

  g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = '#5B5A60'; g.font = `${Math.round(w*0.024)}px "Zen Kaku Gothic New"`;

function playTerm(lines){
  clearTimeout(termTimer);
  const out = $('#term-out'); if(!out) return;
  const fmt = l => l.startsWith('$ ') ? `<span class="cmd">${esc(l)}</span>` : esc(l);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ out.innerHTML = lines.map(fmt).join('\n'); return; }
  let li = 0, ci = 0, html = '';
  const step = () => {
    const o = $('#term-out'); if(!o) return;
    if(li >= lines.length){ o.innerHTML = html + '<span class="caret"></span>'; return; }
    const line = lines[li];
    if(line.startsWith('$ ')){
      ci = Math.min(line.length, ci + 2);
      o.innerHTML = html + `<span class="cmd">${esc(line.slice(0, ci))}</span><span class="caret"></span>`;
      if(ci >= line.length){ html += fmt(line) + '\n'; li++; ci = 0; termTimer = setTimeout(step, 500); } else termTimer = setTimeout(step, 28);
    } else { html += fmt(line) + '\n'; li++; o.innerHTML = html + '<span class="caret"></span>'; termTimer = setTimeout(step, line ? 280 : 120); }
  };
  step();
}

function wrappedStats(){

  if(f.dataset.form === 'guest-join'){ const n = ($('#gp-name').value || '').trim().split(/\s+/)[0]; if(!n){ toast('Type your first name to join.'); return; } S.guestName = n.slice(0, 20); S.guestId = S.guestName + '#' + now().toString(36); save(); openGuest(); }
  if(f.dataset.form === 'guest-snap') guestPost('snap');
  if(f.dataset.form === 'hanko'){ const v = [...($('#hk-char').value || '').trim()][0]; if(!v){ toast('Type one character.'); return; } S.hanko = v; save(); render(); openBook('shop'); toast('Your seal is on every stamp now.'); }
  if(f.dataset.form === 'handle'){ const v = ($('#pr-handle').value || '').trim().toLowerCase().replace(/[^a-z0-9_.]/g, ''); if(!v){ toast('Letters, numbers, dots and underscores only.'); return; } S.handle = v.slice(0, 20); save(); openProfile(); toast('Username saved.'); }
  if(f.dataset.form === 'join-name'){ const n = ($('#jn-name').value || '').trim().split(/\s+/)[0]; if(!n){ toast('Type your first name to join.'); return; } joinCrew(n.slice(0, 20)); }
  if(f.dataset.form === 'join-account'){ const h = ($('#jn-handle').value || '').trim().toLowerCase().replace(/[^a-z0-9_.]/g, ''); if(!h){ toast('Pick a username.'); return; } joinState.handle = h; joinState.step = 'done'; openJoin(joinState.crew); toast('Account made.'); }
  if(f.dataset.form === 'guest-project') guestPost('project');
});
document.addEventListener('change', async e => {
  if(e.target.id === 'pf-folder' && draft){
    const inp = $('#pf-project');
    if(e.target.value === '__new'){ inp.hidden = false; inp.value = ''; inp.focus(); draft.project = ''; }
    else { inp.hidden = true; draft.project = e.target.value; }
    return;
  }
  const m = e.target.id && e.target.id.match(/^(pf|sn)-all$/);
  if(m){ $$(`input[name="${m[1]}-crew"]`).forEach(i => { if(i.dataset.kind !== 'event') i.checked = e.target.checked; }); return; }
  const n = e.target.name && e.target.name.match(/^(pf|sn)-crew$/);
  if(n){ const all = $(`#${n[1]}-all`); if(all) all.checked = $$(`input[name="${n[1]}-crew"]`).filter(i => i.dataset.kind !== 'event').every(i => i.checked); }
  if(e.target.id === 'shot-input'){ await addShots(e.target.files); e.target.value = ''; }
  if(e.target.id === 'sn-photo' && e.target.files[0]){ await setSnapPhoto(e.target.files[0]); e.target.value = ''; }
  if(e.target.id === 'gp-photo' && e.target.files[0]){ await setGuestPhoto(e.target.files[0]); e.target.value = ''; }
});
async function setSnapPhoto(file){
  if(!file.type.startsWith('image/')){ toast("That isn't an image."); return; }
  try{ snapDraft.image = await readImage(file, 900); const pv = $('#sn-preview'); if(pv){ pv.src = snapDraft.image; pv.hidden = false; } }catch(err){ toast("Couldn't read that photo."); }
}
document.addEventListener('dragover', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if(z){ e.preventDefault(); z.classList.add('is-over'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest && e.target.closest('[data-drop]'); if(z) z.classList.remove('is-over'); });
document.addEventListener('drop', e => {
  const z = e.target.closest && e.target.closest('[data-drop]'); if(!z) return; e.preventDefault(); z.classList.remove('is-over');
  if(z.dataset.drop === 'snap'){ if(e.dataTransfer.files[0]) setSnapPhoto(e.dataTransfer.files[0]); }
  else if(z.dataset.drop === 'guest'){ if(e.dataTransfer.files[0]) setGuestPhoto(e.dataTransfer.files[0]); }
  else addShots(e.dataTransfer.files);
});
document.addEventListener('paste', e => {
  const items = [...((e.clipboardData && e.clipboardData.items) || [])].filter(i => i.type && i.type.startsWith('image/'));
  if(!items.length) return;
  if(!$('#scrim').hidden && snapDraft && $('#sn-photo')){ e.preventDefault(); setSnapPhoto(items[0].getAsFile()); return; }
  if(!$('#scrim').hidden && $('#gp-photo')){ e.preventDefault(); setGuestPhoto(items[0].getAsFile()); return; }
  if(S.view === 'tray' && $('#scrim').hidden){ e.preventDefault(); addShots(items.map(i => i.getAsFile())); }
});
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if(VIEWS.includes(v) && v !== S.view){ S.view = v; save(); render(); } });

(S.newCrews || []).forEach(c => { if(!CREWS.some(x => x.id === c.id)) CREWS.push(c); });
const h0 = location.hash.slice(1); if(VIEWS.includes(h0)) S.view = h0;
render(); updateTokBadge();
if(!S.welcomed) setTimeout(openWelcome, 350);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if($('#scrim').hidden) render(); });
})();
</script>
</body></html>
