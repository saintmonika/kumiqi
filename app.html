<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EBEBE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kumiqi">
<meta name="description" content="Small crews see what each other made this week, as stamps.">
<title>Kumiqi</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-title" content="Kumiqi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
/* Layout: one phone-width column of paper objects (stamps, postcards, folders, a stamp sheet) on a desk, tabs pinned to the bottom. */
:root{
  --desk:#EBEBE8; --desk-2:#E0E0DB; --surface:#F6F6F3; --raised:#FFFFFF;
  --ink:#17171A; --ink-2:#4E4E55; --ink-3:#85858B; --line:#D3D3CE;
  --paper:#FBFAF6; --paper-ink:#1B1B20; --paper-ink-2:#5B5A60; --sheet-line:#CFCCC2;
  --mustard:#E2B13C; --magenta:#D4378A; --sea:#2A7AA6; --vermilion:#E2513A; --moss:#4F8A57; --night:#2B2D42;
  --on-mustard:#2A1F06; --on-magenta:#FFFFFF; --on-sea:#FFFFFF; --on-vermilion:#FFFFFF; --on-moss:#FFFFFF; --on-night:#FFFFFF;
  --accent:#C62F7F; --on-accent:#FFFFFF;
  --drop:rgba(20,20,30,.13); --scrim:rgba(18,18,24,.42);
  --shadow:0 1px 1px rgba(20,20,30,.08), 0 10px 22px rgba(20,20,30,.09);
  /* Wix Madefor Display for names and titles, mincho on the stamps, a quiet gothic sans for everything else. */
  --font-display:"Wix Madefor Display",system-ui,-apple-system,"Segoe UI",sans-serif; --dw:600;
  --font-stamp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --font-body:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mincho:var(--font-stamp);
  --col:480px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#111113; --desk-2:#1C1C20; --surface:#18181B; --raised:#212125;
    --ink:#F1F0EB; --ink-2:#BEBDB7; --ink-3:#85847F; --line:#303036;
    --paper:#F0EEE6; --paper-ink:#1B1B20; --paper-ink-2:#5B5A60; --sheet-line:#C9C5B9;
    --mustard:#E9BC4E; --magenta:#EE5AA6; --sea:#4A9BCB; --vermilion:#F0664C; --moss:#6AA672; --night:#4A4E73;
    --on-mustard:#211804; --on-magenta:#1C0613; --on-sea:#06131C; --on-vermilion:#1E0904; --on-moss:#07140A; --on-night:#FFFFFF;
    --accent:#F06AAE; --on-accent:#1C0613;
    --drop:rgba(0,0,0,.55); --scrim:rgba(0,0,0,.62);
    --shadow:0 1px 1px rgba(0,0,0,.5), 0 12px 26px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#111113; --desk-2:#1C1C20; --surface:#18181B; --raised:#212125;
  --ink:#F1F0EB; --ink-2:#BEBDB7; --ink-3:#85847F; --line:#303036;
  --paper:#F0EEE6; --paper-ink:#1B1B20; --paper-ink-2:#5B5A60; --sheet-line:#C9C5B9;
  --mustard:#E9BC4E; --magenta:#EE5AA6; --sea:#4A9BCB; --vermilion:#F0664C; --moss:#6AA672; --night:#4A4E73;
  --on-mustard:#211804; --on-magenta:#1C0613; --on-sea:#06131C; --on-vermilion:#1E0904; --on-moss:#07140A; --on-night:#FFFFFF;
  --accent:#F06AAE; --on-accent:#1C0613;
  --drop:rgba(0,0,0,.55); --scrim:rgba(0,0,0,.62);
  --shadow:0 1px 1px rgba(0,0,0,.5), 0 12px 26px rgba(0,0,0,.45);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font:15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--desk)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.app{max-width:var(--col);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(120px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--desk);box-shadow:0 0 0 100vmax var(--desk);clip-path:inset(0 -100vmax);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
.brand{display:flex;align-items:center;gap:8px;font:var(--dw) 23px/1 var(--font-display)}
.blocky{width:30px;height:30px;flex:none}
.brand small{font:11px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);align-self:flex-end;padding-bottom:3px}
.top-actions{display:flex;gap:2px}
.badge.badge-tok{background:var(--mustard);color:var(--on-mustard)}
.badge-tok:empty{display:none}
@media (max-width:370px){.brand small{display:none}.icon-btn{width:36px}}
.icon-btn{position:relative;width:40px;height:40px;display:grid;place-items:center;border:0;background:transparent;border-radius:0;color:var(--ink);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--desk-2)}
.badge{position:absolute;top:4px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:0;background:var(--accent);color:var(--on-accent);font:11px/17px var(--font-body);text-align:center}

.eyebrow{margin:0;font:12px/1.4 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
h1,h2,h3{margin:0;font-weight:400;text-wrap:balance}
.view-head{display:grid;gap:6px;padding-block:8px 4px}
.view-head h1{font:var(--dw) 27px/1.2 var(--font-display)}
.lede{margin:0;color:var(--ink-2);max-width:60ch}
.muted{color:var(--ink-3)}
.small{font-size:13px}

/* Buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:0;padding:10px 14px;font:500 14px/1.15 var(--font-body);background:var(--ink);color:var(--desk);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn-wide{width:100%;padding:13px 16px;font-size:15px}
.link-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:8px 12px;border-radius:0;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);font:500 13.5px/1.15 var(--font-body);cursor:pointer;text-decoration:none;justify-self:start}
.link-btn:hover{box-shadow:inset 0 0 0 1.5px var(--ink-3)}
input,textarea{width:100%;border:1.5px solid var(--line);background:var(--raised);color:var(--ink);border-radius:0;padding:10px 12px;font:16px/1.4 var(--font-body)}
textarea{resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--ink-2)}
.field{display:grid;gap:8px;margin:0;border:0;padding:0;min-width:0}
.field > legend{margin-bottom:9px}
.custom{border-top:1px solid var(--line);padding-top:14px}
.custom > summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;font:500 15px/1.2 var(--font-body)}
.custom > summary::-webkit-details-marker{display:none}
.custom > summary span{font-size:13px;font-weight:400;color:var(--ink-3)}
.custom > summary::after{content:"+";font-size:22px;line-height:1;color:var(--ink-3)}
.custom[open] > summary::after{content:"−"}
.custom-body{display:grid;gap:20px;margin-top:18px}
.sw.sw-auto{width:auto;height:30px;border-radius:0;padding:0 12px;font:500 13px/30px var(--font-body);background:var(--raised);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.sw.sw-auto[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.sw-pick{position:relative;overflow:hidden;background:conic-gradient(#E2513A,#E2B13C,#4F8A57,#2A7AA6,#C62F7F,#E2513A)}
.sw-pick input{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);opacity:0;cursor:pointer;padding:0;border:0}
.crop-row{display:flex;gap:12px;align-items:center}
.crop-row input[type=range]{flex:1;padding:0;border:0;background:none;accent-color:var(--ink)}
.print-preview.can-drag{cursor:grab;touch-action:none}
.check.all-check{font-weight:500}
.field > label:not(.dropzone),.field > legend,.lbl{font:12px/1.3 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Avatars */
.av{display:inline-grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:var(--h);color:var(--hi);font:700 13px/1 var(--font-body)}
.av-sm{width:24px;height:24px;font-size:11px}
.av-xs{width:18px;height:18px;font-size:9.5px}

/* Crew folder */
.crew-tabs{display:flex;gap:4px;align-items:flex-end;margin-top:6px;padding-left:0;overflow-x:auto}
.crew-tab{border:0;cursor:pointer;background:color-mix(in srgb,var(--fc) 38%,var(--desk));color:var(--ink-2);font:500 13.5px/1 var(--font-body);padding:8px 14px 9px;border-radius:0;transition:padding .2s,background .2s;white-space:nowrap}
.crew-tab[aria-selected="true"]{background:var(--fc);color:var(--fc-ink);padding:11px 15px 12px}
.crew-folder{background:var(--fc);color:var(--fc-ink);border-radius:0;padding:18px 16px 16px;display:grid;gap:14px;box-shadow:var(--shadow)}
.crew-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.crew-name{font:var(--dw) 31px/1.1 var(--font-display)}
.crew-kind{margin:6px 0 0;font:12px/1.3 var(--font-body);letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.streak{flex:none;display:grid;place-items:center;align-content:center;width:68px;height:68px;border-radius:50%;border:2px dashed currentColor;text-align:center;font:9.5px/1.15 var(--font-body);letter-spacing:.06em;text-transform:uppercase;transform:rotate(-9deg)}
.streak b{display:block;font:var(--dw) 24px/1 var(--font-display);letter-spacing:0}
.crew-mid{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.avs{display:flex}
.avs .av{margin-left:-7px;box-shadow:0 0 0 2px var(--fc)}
.avs .av:first-child{margin-left:0}
.crew-status{margin:0;font-weight:500;font-size:14px}
.crew-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn.on-folder{background:var(--fc-ink);color:var(--fc)}
.btn.on-folder.ghost{background:transparent;color:var(--fc-ink);box-shadow:inset 0 0 0 1.5px currentColor}
.ledger{list-style:none;margin:0;padding:12px 0 0;border-top:1.5px dashed currentColor;display:grid;gap:7px}
.ledger li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;font-size:14px}
.ledger .n{font:12px var(--font-body);letter-spacing:.03em}
.ledger-note{margin:0;font-size:12.5px;opacity:.8}
.note{margin:14px 0 0;display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-3)}
.note p{margin:0;flex:1}
.note .icon-btn{width:28px;height:28px;margin-top:-4px}

/* The wall */
.wall-head{margin-top:24px}
.wall{columns:2;column-gap:16px;margin-top:14px;isolation:isolate}
@media (max-width:360px){.wall{columns:1}}
.item{break-inside:avoid;margin:0 0 22px;display:grid;gap:7px}
.hit{display:block;cursor:pointer;transform:rotate(var(--tilt,0deg));transition:transform .25s ease;border-radius:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
@media (hover:hover){.hit:hover{transform:rotate(0deg) translateY(-2px)}}
.by{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);padding-left:4px;min-width:0}
.by-when{color:var(--ink-3)}
.by-r{margin-left:auto;flex:none;min-width:20px;padding:2px 5px;border:1px solid var(--line);border-radius:0;text-align:center;font:11px/1.2 var(--font-body);color:var(--ink-2)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.is-new .hit{animation:drop .7s cubic-bezier(.2,1.3,.4,1) both}
.is-new .postmark{animation:thump .55s .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{0%{transform:translateY(-30px) rotate(-8deg) scale(1.08);opacity:0}100%{transform:rotate(var(--tilt,0deg));opacity:1}}
@keyframes thump{0%{transform:rotate(-14deg) scale(1.9);opacity:0}60%{opacity:.9}100%{transform:rotate(-14deg) scale(1);opacity:.72}}

/* Stamp */
.stamp{--r:5px;position:relative;display:block;width:100%;padding:calc(2*var(--r));color:var(--paper-ink);text-align:left;
  background:radial-gradient(var(--r),#0000 97%,var(--paper)) round calc(-1.5*var(--r)) calc(-1.5*var(--r))/calc(3*var(--r)) calc(3*var(--r)),
             linear-gradient(var(--paper) 0 0) no-repeat 50%/calc(100% - 3*var(--r)) calc(100% - 3*var(--r));
  filter:drop-shadow(0 1px 0 var(--drop)) drop-shadow(0 6px 10px var(--drop))}
.stamp-art{position:relative;aspect-ratio:var(--ar,4/5);overflow:hidden;background:var(--paper);box-shadow:inset 0 0 0 1px rgba(0,0,0,.07)}
.stamp-art svg,.stamp-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hanko{position:absolute;top:7px;left:7px;width:21px;height:21px;display:grid;place-items:center;background:#D8432F;color:#FBFAF6;font:700 12.5px/1 var(--font-mincho);border-radius:0;transform:rotate(5deg);box-shadow:0 0 0 1.5px rgba(251,250,246,.9)}
.stamp-band{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding-top:7px}
.stamp-text{min-width:0;display:grid;gap:3px}
.stamp-title{font:600 13.5px/1.25 var(--font-mincho);color:var(--paper-ink);overflow-wrap:anywhere}
.stamp-meta{font:10px/1.2 var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--paper-ink-2)}
.stamp-denom{flex:none;text-align:right;line-height:1}
.stamp-denom b{display:block;font:800 21px/1 var(--font-stamp);color:var(--c);font-variant-numeric:tabular-nums}
.stamp-denom span{font:10px/1 var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--paper-ink-2)}
/* Cut and scrapped stamps: a cancellation band, or a VOID overprint like a misprinted stamp. */
.mark-cut{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;background:linear-gradient(162deg,#0000 calc(44% - 2.5px),#D8432F calc(44% - 2.5px) 44%,#0000 44% 56%,#D8432F 56% calc(56% + 2.5px),#0000 calc(56% + 2.5px))}
.mark-cut b{transform:rotate(-18deg);background:#FBFAF6;color:#D8432F;font:700 11px/1 var(--font-body);letter-spacing:.24em;padding:3px 4px 3px 7px;border-radius:0}
.mark-void{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-18deg);border:3px double #D8432F;color:#D8432F;font:800 26px/1 var(--font-stamp);letter-spacing:.12em;padding:5px 6px 4px 10px;background:rgba(251,250,246,.55);pointer-events:none}
.stamp.is-scrap .stamp-art > svg,.stamp.is-scrap .stamp-art > img{filter:grayscale(.75) contrast(.9)}
.stamp.is-cut .stamp-denom b,.stamp.is-scrap .stamp-denom b{color:#D8432F}
.stamp-sm .mark-void{font-size:16px;border-width:2px;padding:3px 4px 2px 6px}
.stamp-sm .mark-cut b{font-size:8px;padding:2px 3px 2px 5px}
.stamp-lg .mark-void{font-size:36px}
.postmark{position:absolute;top:2px;right:-2px;width:72px;color:#2A2A35;opacity:.72;transform:rotate(-14deg);pointer-events:none;mix-blend-mode:multiply}
.stamp-sm{--r:3.5px}
.stamp-sm .stamp-title{font-size:11px}
.stamp-sm .stamp-meta{display:none}
.stamp-sm .stamp-denom b{font-size:15px}
.stamp-sm .stamp-denom span{font-size:8.5px}
.stamp-sm .hanko{width:15px;height:15px;font-size:9px;top:5px;left:5px}
.stamp-sm .postmark{width:48px}
.stamp-lg .stamp-title{font-size:16px}
.stamp-lg .stamp-denom b{font-size:28px}
.stamp-lg .postmark{width:92px}

/* Postcard (snaps) */
.postcard{position:relative;background-color:var(--paper);color:var(--paper-ink);padding:22px 14px 12px;box-shadow:0 1px 0 var(--drop),0 6px 12px var(--drop);
  background-image:repeating-linear-gradient(to bottom,transparent 0 23px,rgba(40,50,80,.10) 23px 24px);background-position:0 20px}
.postcard img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;margin-bottom:10px}
.tape{position:absolute;top:-9px;left:50%;width:58px;height:18px;transform:translateX(-50%) rotate(-4deg);background:var(--mustard);opacity:.62}
.pc-text{margin:0;font:500 15px/24px var(--font-body);color:var(--paper-ink);overflow-wrap:anywhere}
.pc-foot{display:block;margin-top:8px;font:10px/1.2 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--paper-ink-2)}

/* Tray */
.add-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.add-row .lbl{margin-right:2px}
.add-btn{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:0;padding:7px 13px;font:500 13.5px/1 var(--font-body);cursor:pointer}
.add-btn[aria-expanded="true"]{background:var(--ink);color:var(--desk);border-color:var(--ink)}
.src-panel{margin-top:12px}
.src{display:grid;gap:6px;margin:0}
.src-row{display:flex;gap:8px}
.src-row input{flex:1;min-width:0}
.src-note{margin:10px 0 0;font-size:12.5px;color:var(--ink-3)}
.btn.small{padding:8px 12px;font-size:13.5px}
.printed{margin-top:18px;font-size:14px;color:var(--ink-2)}
.printed summary{cursor:pointer;font-size:13px;color:var(--ink-3)}
.printed ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.printed li{display:flex;justify-content:space-between;gap:12px}
.printed li span{color:var(--ink-3);font-size:13px}
.dropzone{display:grid;place-items:center;align-content:center;text-align:center;gap:2px;padding:14px;border:1.5px dashed var(--line);border-radius:0;color:var(--ink-2);cursor:pointer;font-size:13.5px;min-height:86px}
.dropzone b{font-weight:500;color:var(--ink)}
.dropzone.is-over{border-color:var(--accent);background:var(--desk-2)}
.proofs{display:grid;margin-top:14px;border-top:1px solid var(--line)}
.proof{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.proof-thumb{align-self:start;padding:6px;background:var(--paper);box-shadow:0 1px 2px var(--drop),0 4px 8px var(--drop);transform:rotate(-2deg)}
.proof-thumb .art{position:relative;aspect-ratio:4/5;overflow:hidden}
.proof-thumb svg,.proof-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.proof-body{min-width:0;display:grid;gap:4px;align-content:start}
.proof-title{font:var(--dw) 17px/1.3 var(--font-display)}
.proof-meta{margin:0;font-size:12.5px;color:var(--ink-3)}
.proof-cap{margin:2px 0 0;color:var(--ink-2);font-size:14px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.proof-actions{display:flex;align-items:center;gap:8px;margin-top:8px}
.empty{display:grid;justify-items:center;text-align:center;gap:8px;padding:28px 12px;color:var(--ink-2)}
.empty .blocky{width:56px;height:56px}

/* Sheet (modal) */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.sheet{position:relative;width:100%;max-width:540px;max-height:100%;overflow:auto;background:var(--surface);color:var(--ink);border-radius:0;
  padding:22px max(18px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.scrim[hidden]{display:none}
@media (min-width:720px){.scrim{align-items:center;padding:24px}.sheet{border-radius:0;max-height:92%}}
@keyframes up{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.sheet-x{position:absolute;top:10px;right:10px;z-index:2}
.sheet h2{font:var(--dw) 24px/1.25 var(--font-display);padding-right:40px}

/* Detail */
.detail{display:grid;gap:18px}
.detail-visual{width:min(290px,80%);margin:8px auto 0;transform:rotate(-1.5deg)}
.detail-info{display:grid;gap:12px}
.detail-visual.is-card{width:min(260px,72%)}
.detail-head{display:flex;gap:10px;align-items:center}
.detail-head h2{font:var(--dw) 22px/1.2 var(--font-display);padding-right:0}
.detail-meta{margin:2px 0 0;font-size:13px;color:var(--ink-3)}
.detail-cap{margin:0;font-size:16px}
.detail-info > .btn{justify-self:start}
.private{border:1.5px dashed var(--accent);border-radius:0;padding:14px;display:grid;gap:12px}
.private-label{margin:0;font:11.5px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.private p{margin:0}
.letters{display:grid;gap:10px}
.letter{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:12px 12px 10px;background:var(--paper);color:var(--paper-ink);box-shadow:0 1px 2px var(--drop),0 4px 10px var(--drop)}
.letter p{margin:0}
.letter .from{font:700 13.5px var(--font-body)}
.letter .on{font:10.5px var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--paper-ink-2)}
.letter .txt{margin-top:3px;font-size:14.5px}
.letter-tools{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
.pin{border:1.5px solid var(--paper-ink);background:transparent;color:var(--paper-ink);border-radius:0;padding:4px 10px;font:500 12.5px/1.2 var(--font-body);cursor:pointer}
.pin[aria-pressed="true"]{background:var(--paper-ink);color:var(--paper)}
.pinned-tag{font:10.5px var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--paper-ink-2)}
.open-from-letter{border:0;background:none;padding:0;color:var(--paper-ink);font:600 12.5px var(--font-body);text-decoration:none;cursor:pointer}
.open-from-letter::after{content:' →'}
.write{display:grid;gap:8px}
.ask-check{justify-self:start;padding:6px 10px;font-size:13.5px}
.req-tag{display:inline-block;margin-left:8px;padding:2px 6px;border-radius:0;background:#E2B13C;color:#2A1F06;font:500 10.5px/1.3 var(--font-body);letter-spacing:.04em;text-transform:uppercase;vertical-align:1px}
.req-tag.is-done{background:#4C8655;color:#FFFFFF}
.requests{display:grid;gap:10px;margin-top:18px}
.answers{display:grid;gap:8px}
.req-checks{display:grid;gap:8px}
.req-check{align-items:flex-start;line-height:1.4}
.req-check input{margin-top:3px}
.by{flex-wrap:wrap}
.by-guest{font-size:10.5px;line-height:1.3;padding:0 5px;border:1px solid var(--line);border-radius:0;color:var(--ink-3)}
.av-more{margin-left:7px;align-self:center;font:500 13px/1 var(--font-body)}
.qr-card{flex:none;display:grid;justify-items:center;gap:4px;padding:6px 6px 5px;background:#FBFAF6;color:#17171A;border-radius:0;font:500 10px/1 var(--font-body);letter-spacing:.08em;transform:rotate(3deg);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.qr{display:block;width:70px;height:70px}
.guestpage{display:grid;gap:12px}
.gp-bar{display:flex;align-items:center;gap:8px;margin-right:44px;padding:9px 12px;border-radius:0;background:var(--desk-2);color:var(--ink-2);font:13px/1 var(--font-body);min-width:0;overflow:hidden;white-space:nowrap}
.gp-dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--moss)}
.gp-keep{display:grid;gap:10px;padding:14px;border:1.5px dashed var(--accent);border-radius:0}
.gp-keep p{margin:0}
.gp-keep .btn{justify-self:start}
.remove-btn{justify-self:start;color:var(--vermilion)}
.by-ans{font-size:11.5px;color:var(--accent);white-space:nowrap}
.write label{font-weight:700;font-size:14px}
.sent{display:grid;gap:8px}

/* Print */
.print{display:grid;gap:18px}
.print-preview{width:min(220px,64%);margin:4px auto 0;transform:rotate(-2deg)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--raised);border-radius:0;padding:7px 12px;font:500 13.5px var(--font-body);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--desk)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:0;background:var(--sw);cursor:pointer;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4.5px var(--ink)}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.check{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border:1.5px solid var(--line);border-radius:0;cursor:pointer;font-size:14px;background:var(--raised)}
.check input{width:auto;margin:0;accent-color:var(--ink)}
.snap-preview{display:block;width:120px;aspect-ratio:4/3;object-fit:cover;border-radius:0}

/* Roll */
.countdown{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:4px}
.countdown b{font:var(--dw) 34px/1 var(--font-display);font-variant-numeric:tabular-nums}
.stampsheet{margin-top:16px;background:var(--paper);color:var(--paper-ink);padding:26px 10px 12px;box-shadow:var(--shadow);position:relative}
.selvage{position:absolute;top:8px;left:14px;right:14px;display:flex;justify-content:space-between;font:10px var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--paper-ink-2)}
.cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.cell{padding:10px 8px;border-right:2px dotted var(--sheet-line);border-bottom:2px dotted var(--sheet-line);min-width:0;display:grid;place-items:center;min-height:150px}
.cell:nth-child(3n){border-right:0}
.cell:nth-last-child(-n+3){border-bottom:0}
.cell > *{width:100%}
.cell .postcard{padding:16px 8px 8px}
.cell .pc-text{font-size:11.5px;line-height:18px}
.cell .tape{width:36px;height:12px;top:-6px}
.cell-empty{font:10.5px/1.4 var(--font-body);color:var(--paper-ink-2);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.cell > .hit,.cell > .cell-open{width:84%}
.stamp-xs{--r:3px;filter:drop-shadow(0 0 .7px rgba(0,0,0,.4))}
.xs-band{display:grid;gap:3px;padding-top:5px;min-width:0}
.xs-band span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 10.5px/1.2 var(--font-mincho);color:var(--paper-ink)}
.xs-band b{flex:none;font:800 11px/1 var(--font-stamp);color:var(--c);font-variant-numeric:tabular-nums}
.stamp-xs.is-cut .xs-band b,.stamp-xs.is-scrap .xs-band b{color:#D8432F}
.sp-snap{aspect-ratio:4/5;background:#FBFAF6;padding:4px 4px 12px;box-shadow:0 0 0 1px rgba(0,0,0,.12);border-radius:0}
.sp-snap img{width:100%;height:100%;object-fit:cover;display:block}
.sp-snap.is-note{padding:10px 9px}
.sp-snap.is-note p{margin:0;font:500 10.5px/1.4 var(--font-body);color:var(--paper-ink);display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.cell-open{aspect-ratio:4/5;border:1.5px dashed var(--sheet-line);border-radius:0;background:transparent;color:var(--paper-ink-2);font:300 26px/1 var(--font-body);cursor:pointer}
.cell-open:hover{color:var(--paper-ink);border-color:var(--paper-ink-2)}
.roll-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.crew-sheets{display:grid;gap:18px;margin-top:26px}
.mini{display:grid;gap:8px}
.mini-head{display:flex;align-items:center;gap:8px;font-weight:500}
.mini-row{display:flex;gap:12px;overflow-x:auto;padding:6px 4px 12px}
.mini-row > *{flex:0 0 100px}
.mini-row .postcard{padding:16px 8px 8px}
.mini-row .pc-text{font-size:11.5px;line-height:18px}
.mini-row .tape{width:36px;height:12px;top:-6px}

/* Album */
.folder{display:grid;grid-template-columns:116px minmax(0,1fr);align-items:center;margin-top:28px}
.folder-cover{position:relative;z-index:2;height:170px;border:0;cursor:pointer;background:var(--fc);color:var(--fc-ink);border-radius:0;padding:14px 12px;display:grid;align-content:end;gap:5px;text-align:left;transform:perspective(700px) rotateY(16deg);transform-origin:left center;box-shadow:var(--shadow);transition:transform .35s ease}
.folder-cover::before{content:"";position:absolute;top:-9px;left:12px;width:44px;height:14px;background:var(--fc);border-radius:0}
.folder-cover::after{content:"";position:absolute;left:12px;right:12px;bottom:52px;height:1.5px;background:currentColor;opacity:.25}
.folder.is-open .folder-cover{transform:perspective(700px) rotateY(24deg)}
.folder-name{font:var(--dw) 18px/1.15 var(--font-display);overflow-wrap:anywhere}
.folder-meta{font:10.5px/1.3 var(--font-body);letter-spacing:.04em;text-transform:uppercase;opacity:.8}
.folder-strip{display:flex;gap:12px;overflow-x:auto;padding:18px 10px 18px 26px;margin-left:-16px;background:color-mix(in srgb,var(--fc) 30%,var(--desk));border-radius:0;min-height:150px;align-items:center}
.strip-item{flex:0 0 112px;display:grid;gap:6px;transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .35s;transition-delay:calc(var(--i)*60ms)}
.folder:not(.is-open) .strip-item{transform:translateX(-50px);opacity:0}
.strip-date{font:10.5px var(--font-body);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);text-align:center}
.fswatches{display:flex;gap:12px;justify-content:center;margin-top:16px}
.fswatches .sw{width:26px;height:26px;box-shadow:0 0 0 2px var(--desk),0 0 0 3.5px var(--line)}
.fswatches .sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--desk),0 0 0 4.5px var(--ink)}
.album-stats{margin:10px 0 0;text-align:center;font:12.5px var(--font-body);color:var(--ink-2);letter-spacing:.03em}
.album-snaps{margin-top:30px;display:grid;gap:10px}
.reset{display:flex;justify-content:center;margin-top:36px}

/* Share card */
.card-wrap{display:grid;gap:14px;justify-items:center}
.card-edit{display:grid;gap:20px}
.card-stage{position:relative;width:min(100%,290px);justify-self:center;aspect-ratio:9/16;box-shadow:var(--shadow);background:var(--desk-2);transition:opacity .2s}
.card-stage.is-busy{opacity:.55}
.card-stage .card-img{width:100%;height:100%;box-shadow:none}
.card-side{display:grid;gap:20px;min-width:0}
.stk-layer{position:absolute;inset:0;overflow:hidden}
.stk{position:absolute;max-width:none;cursor:grab;touch-action:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.stk.is-sel{outline:2px dashed var(--accent);outline-offset:3px}
.stk-x{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:var(--desk);font:600 16px/26px var(--font-body);cursor:pointer;padding:0;z-index:2}
.stk-pick{display:flex;flex-wrap:wrap;gap:8px}
.stk-pick button{width:66px;height:54px;overflow:hidden;border:1.5px solid var(--line);border-radius:0;background:var(--raised);display:grid;place-items:center;cursor:pointer;padding:7px}
.stk-pick img{width:100%;height:100%;object-fit:contain;display:block;min-height:0}
.folder-pick select{width:100%;border:1.5px solid var(--line);background:var(--raised);color:var(--ink);border-radius:0;padding:10px 12px;font:16px/1.4 var(--font-body)}
.card-img{display:block;width:min(100%,300px);box-shadow:var(--shadow);background:var(--desk-2);aspect-ratio:9/16}
.card-loading{display:grid;place-items:center;width:min(100%,300px);aspect-ratio:9/16;background:var(--desk-2);color:var(--ink-3);font:12px var(--font-body);letter-spacing:.06em;text-transform:uppercase}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--desk);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabbar-in{max-width:calc(var(--col) - 32px);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 76px minmax(0,1fr) minmax(0,1fr);align-items:stretch;height:68px}
.tab{display:grid;justify-items:center;align-content:end;gap:5px;min-width:44px;border:0;background:none;color:var(--ink-3);cursor:pointer;padding:10px 0 12px;font:10.5px/1 var(--font-body);letter-spacing:.07em;text-transform:uppercase;position:relative}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:50%;width:18px;height:3px;transform:translateX(-50%);background:var(--vermilion);border-radius:0}
.snap-btn{--r:4px;justify-self:center;align-self:center;width:56px;height:56px;border:0;cursor:pointer;color:var(--desk);display:grid;place-items:center;transform:rotate(-6deg) translateY(-12px);transition:transform .2s;
  background:radial-gradient(var(--r),#0000 97%,var(--ink)) round calc(-1.5*var(--r)) calc(-1.5*var(--r))/calc(3*var(--r)) calc(3*var(--r)),
             linear-gradient(var(--ink) 0 0) no-repeat 50%/calc(100% - 3*var(--r)) calc(100% - 3*var(--r));
  filter:drop-shadow(0 4px 8px var(--drop))}
.snap-btn:hover{transform:rotate(0deg) translateY(-14px)}
.snap-btn .i{width:24px;height:24px}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);opacity:0;z-index:70;background:var(--ink);color:var(--desk);padding:10px 14px;border-radius:0;font-size:14px;width:max-content;max-width:min(88vw,420px);transition:opacity .25s,transform .25s;pointer-events:none}
.toast.is-on{opacity:1;transform:translateX(-50%)}

/* Detail actions, clips */
.detail-actions{display:flex;gap:8px;flex-wrap:wrap}
.term{background:#121216;color:#E9E7E1;border-radius:0;padding:14px 14px 16px;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:220px;max-height:60vh;overflow:auto;box-shadow:var(--shadow)}
.term-bar{display:flex;gap:6px;margin-bottom:10px}
.term-bar i{width:10px;height:10px;border-radius:50%;background:#3A3A42}
.term pre{margin:0;font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}
.term .cmd{color:#F0C85A}
.term .caret{display:inline-block;width:7px;height:14px;background:#E9E7E1;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.screen-clip{position:relative;overflow:hidden;border-radius:0;aspect-ratio:4/3;background:var(--desk-2);box-shadow:var(--shadow)}
.screen-clip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 6s ease-in-out infinite alternate}
.screen-clip .cursor{position:absolute;width:24px;height:24px;left:30%;top:72%;animation:cur 6s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.18) translate(-5%,-4%)}}
@keyframes cur{0%{left:30%;top:72%}45%{left:62%;top:42%;transform:scale(1)}52%{left:62%;top:42%;transform:scale(.8)}60%{transform:scale(1)}100%{left:46%;top:28%}}
.clip-row{display:flex;gap:8px;margin-top:12px}
/* Blur editor */
.blur-wrap{display:grid;gap:8px}
.blur-stage{position:relative;touch-action:none;cursor:crosshair;overflow:hidden;border-radius:0;box-shadow:inset 0 0 0 1px var(--line);background:var(--desk-2);user-select:none}
.blur-stage canvas{display:block;width:100%;height:auto}
.blur-rect{position:absolute;border:2px dashed var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);pointer-events:none}
.blur-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.blur-found{display:grid;gap:10px;padding:12px;border:1.5px dashed var(--accent);border-radius:0}
.blur-found p{margin:0}
/* Sample connections */
.me-qr{display:grid;justify-items:center;gap:6px;margin:14px 0 16px}
.me-qr .qr{width:180px;height:180px;padding:10px;background:#FBFAF6;border-radius:0;box-shadow:var(--shadow)}
.me-handle{margin:6px 0 0;font:var(--dw) 22px/1.2 var(--font-display)}
.me-qr p{margin:0}
.iv-qr{display:flex;align-items:center;gap:14px;padding:12px;border:1.5px dashed var(--line);border-radius:0}
.iv-qr .qr{width:84px;height:84px;flex:none}
.iv-qr p{margin:0}
#iv-text{width:100%;border:1.5px solid var(--line);background:var(--raised);color:var(--ink);border-radius:0;padding:10px 12px;font:16px/1.4 var(--font-body);resize:vertical}
.join-head{background:var(--fc);color:var(--fc-ink);border-radius:0;padding:16px;display:grid;gap:6px}
.join-head .crew-name{margin:0}
.join-head .crew-kind{margin:0;color:var(--fc-ink);opacity:.85}
.join-opts{display:flex;flex-wrap:wrap;gap:8px}
/* Snap papers */
.postcard.paper-graph{background-image:linear-gradient(rgba(42,91,166,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(42,91,166,.13) 1px,transparent 1px);background-size:12px 12px;background-position:0 0}
.postcard.paper-sticky{background:#F6E27A;color:#2A2410;box-shadow:0 1px 0 var(--drop),4px 8px 10px -4px var(--drop);border-radius:0}
.postcard.paper-sticky .tape,.postcard.paper-receipt .tape,.postcard.paper-ticket .tape,.postcard.paper-envelope .tape,.postcard.paper-polaroid .tape{display:none}
.postcard.paper-sticky .pc-text{color:#2A2410}
.postcard.paper-receipt{background:#FFFFFF;padding:12px 14px 20px;--zz:7px;-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50% / calc(2*var(--zz)) 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50% / calc(2*var(--zz)) 100%}
.postcard.paper-receipt .pc-text{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:13px;line-height:20px;color:#2B2B30}
.rc-head{display:block;font:600 10px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.14em;color:#6B6B72;padding-bottom:8px;margin-bottom:8px;border-bottom:1.5px dashed #C9C9CC}
.postcard.paper-polaroid{background:#FFFFFF;padding:10px 10px 14px}
.postcard.paper-polaroid:not(:has(img))::before{content:"";display:block;aspect-ratio:4/3;margin-bottom:10px;background:radial-gradient(circle at 70% 30%,#F0C85A 0 12%,transparent 13%),linear-gradient(#3B3F63,#22243A)}
.postcard.paper-polaroid .pc-text{text-align:center}
.postcard.paper-polaroid img{aspect-ratio:1}
/* Laptop view (public website on wide screens) */
.shell .app,.shell .tabbar,.shell #scrim,.shell #toast,.shell body::before{display:none!important}
.shell-wrap{min-height:100vh;display:grid;grid-template-columns:minmax(0,420px) auto;gap:72px;align-items:center;justify-content:center;padding:40px}
.shell-brand{display:flex;align-items:center;gap:10px;font:var(--dw) 24px/1 var(--font-display)}
.shell-brand .blocky{width:40px;height:40px}
.shell-copy h1{font:var(--dw) 46px/1.08 var(--font-display);margin:20px 0 12px;letter-spacing:-.01em}
.shell-lede{font-size:18px;line-height:1.5;color:var(--ink-2);margin:0 0 28px}
.shell-k{font:12px/1.3 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.shell-try{margin:0;padding-left:20px;display:grid;gap:10px;color:var(--ink-2);font-size:15.5px}
.shell-try b{color:var(--ink);font-weight:600}
.shell-note{margin:28px 0 0;font-size:13px;line-height:1.5;color:var(--ink-3)}
.shell-phone{width:390px;height:min(844px,calc(100vh - 80px));border-radius:0;padding:12px;background:#0E0E10;box-shadow:0 30px 70px rgba(0,0,0,.28),inset 0 0 0 2px #2C2C31}
.shell-phone iframe{width:100%;height:100%;border:0;border-radius:0;background:var(--desk);display:block}
.postcard.paper-ticket{background:#F3D9A4;color:#3A2A0E;padding:12px 14px 14px 30px;-webkit-mask:radial-gradient(circle 8px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 8px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 8px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 8px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.postcard.paper-ticket::after{content:"";position:absolute;left:20px;top:8px;bottom:8px;border-left:1.5px dashed rgba(58,42,14,.4)}
.postcard.paper-ticket .pc-text{color:#3A2A0E}
.tk-head{display:block;font:700 9.5px/1 var(--font-body);letter-spacing:.24em;color:#9A6B1E;margin-bottom:6px}
.postcard.paper-envelope{background:#DCC097;color:#3A2A14;padding-top:34px;background-image:linear-gradient(to bottom right,transparent 49%,rgba(58,42,20,.22) 50%,transparent 52%),linear-gradient(to bottom left,transparent 49%,rgba(58,42,20,.22) 50%,transparent 52%);background-size:50% 28px;background-position:left top,right top;background-repeat:no-repeat}
.postcard.paper-envelope .pc-text{color:#3A2A14}
.paper-pick{display:flex;flex-wrap:wrap;gap:8px}
.paper-pick button{display:grid;justify-items:center;gap:5px;border:1.5px solid var(--line);background:var(--raised);border-radius:0;padding:8px 8px 7px;cursor:pointer;font:12px/1.2 var(--font-body);color:var(--ink-2);min-width:72px}
.paper-pick button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.paper-pick button.is-locked{color:var(--ink-3)}
.paper-pick button.is-locked .pp-sw{opacity:.45}
.paper-pick .lock{width:12px;height:12px;vertical-align:-2px;margin-right:2px}
.about{margin-top:8px;padding:12px 14px;border-radius:0;background:var(--desk-2);text-align:left;width:100%}
.about p{margin:0;font:13.5px/1.5 var(--font-body);color:var(--ink-2)}
.about .about-k{font:11px/1.3 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.style-note{margin:8px 0 0;font:12.5px/1.45 var(--font-body);color:var(--ink-3)}
.postmark.glitch{filter:drop-shadow(2px 0 0 rgba(0,179,199,.85)) drop-shadow(-2px 0 0 rgba(224,69,139,.85));opacity:.9}
.q-slot{width:70%;aspect-ratio:4/5;display:grid;place-items:center;border:1.5px dashed var(--line);border-radius:0;font:var(--dw) 28px/1 var(--font-display);color:var(--ink-3)}
.egg-detail.is-fresh .cl-big{animation:drop .6s cubic-bezier(.3,1.4,.5,1) both}
.brand{cursor:default;user-select:none}
.blocky.boop{animation:boop .25s ease}
@keyframes boop{50%{transform:scale(1.18) rotate(-6deg)}}
.egg-pop{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:rgba(18,18,24,.62);animation:epFade .25s ease both}
.egg-pop.is-out{animation:epFade .22s ease reverse both}
.ep-card{position:relative;width:min(100%,320px);background:var(--surface);color:var(--ink);border-radius:0;padding:30px 22px 24px;text-align:center;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:epPop .5s cubic-bezier(.2,1.4,.4,1) both}
.ep-x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--desk-2);color:var(--ink);font:500 20px/1 var(--font-body);cursor:pointer;z-index:3}
.ep-stage{position:relative;width:150px;height:170px;margin:4px auto 10px;display:grid;place-items:center}
.ep-burst{position:absolute;inset:-40px;border-radius:50%;background:repeating-conic-gradient(rgba(226,177,60,.28) 0 10deg,transparent 10deg 20deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:epSpin 9s linear infinite,epFade .6s .2s ease both}
.ep-stamp{position:relative;width:118px;animation:epDrop .7s .15s cubic-bezier(.2,1.5,.4,1) both}
.ep-stamp .cl-svg{width:100%;height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.ep-k{margin:0;font:600 11.5px/1.3 var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);animation:epUp .4s .55s ease both}
.ep-card h2{margin:6px 0 8px;font:var(--dw) 24px/1.2 var(--font-display);animation:epUp .4s .65s ease both}
.ep-how{margin:0;font:14px/1.5 var(--font-body);color:var(--ink-2);animation:epUp .4s .75s ease both}
.ep-tok{display:inline-block;margin:14px 0 0;padding:6px 12px;border-radius:0;background:var(--mustard);color:var(--on-mustard);font:600 13px/1 var(--font-body);animation:epUp .4s .9s cubic-bezier(.2,1.6,.4,1) both}
.ep-confetti{position:absolute;inset:0;pointer-events:none;z-index:2}
.ep-confetti i{position:absolute;top:-12px;width:7px;height:11px;border-radius:0;opacity:0;animation:epFall var(--d) ease-in both}
@keyframes epFade{from{opacity:0}to{opacity:1}}
@keyframes epPop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes epDrop{0%{transform:translateY(-60px) rotate(-14deg) scale(1.25);opacity:0}100%{transform:rotate(-4deg);opacity:1}}
@keyframes epUp{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes epSpin{to{transform:rotate(360deg)}}
@keyframes epFall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(420px) rotate(var(--r))}}
.pp-cost{font:600 11px/1 var(--font-body);color:var(--ink-3);margin-top:-2px}
.pp-sw{display:block;width:40px;height:28px;box-shadow:0 1px 3px var(--drop)}
.pp-sw.paper-notebook{background:var(--paper) repeating-linear-gradient(transparent 0 6px,rgba(40,50,80,.16) 6px 7px)}
.pp-sw.paper-graph{background:#FBFAF6;background-image:linear-gradient(rgba(42,91,166,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(42,91,166,.2) 1px,transparent 1px);background-size:6px 6px}
.pp-sw.paper-sticky{background:#F6E27A}
.pp-sw.paper-envelope{background:#DCC097 linear-gradient(to bottom right,transparent 48%,rgba(58,42,20,.3) 50%,transparent 53%) left top/50% 12px no-repeat}
.pp-sw.paper-receipt{background:#fff repeating-linear-gradient(transparent 0 5px,#ddd 5px 6px)}
.pp-sw.paper-polaroid{background:#fff;border:4px solid #fff;border-bottom-width:9px;box-shadow:0 1px 3px var(--drop),inset 0 0 0 20px #3B3F63}
.pp-sw.paper-ticket{background:#F3D9A4}
/* Stamp book */
.head-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.book-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-right:40px;margin-bottom:12px}
.book-head h2{padding:0!important}
.book-bal{display:flex;gap:6px}
.tok{font:600 12px/1 var(--font-body);padding:6px 9px;border-radius:0;background:var(--mustard);color:var(--on-mustard)}
.tok-freeze{background:var(--vermilion);color:var(--on-vermilion)}
.rally{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rally-cell{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line);display:grid;place-items:center;font:12px/1 var(--font-body);color:var(--ink-3)}
.rally-cell.is-on{border:0;background:var(--paper)}
.rally-cell svg{width:100%;height:100%;display:block}
.cl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.cl-item{display:grid;justify-items:center;gap:3px;border:0;background:none;cursor:pointer;padding:6px 2px;color:var(--ink);text-align:center}
.cl-art{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:4/5}
.cl-svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 3px var(--drop))}
.cl-item.is-locked .cl-svg,.cl-detail.is-locked .cl-svg{filter:grayscale(1) opacity(.28)}
.cl-art .lock,.cl-big .lock{position:absolute;width:22px;height:22px;stroke:var(--ink-2)}
.cl-name{font:600 12.5px/1.2 var(--font-body)}
.cl-rar{font:10.5px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.cl-detail{display:grid;justify-items:center;gap:10px;text-align:center}
.cl-big{position:relative;width:min(56%,210px);aspect-ratio:4/5;display:grid;place-items:center}
.cl-big .lock{width:36px;height:36px}
.cl-prog{width:min(80%,260px);height:8px;border-radius:0;background:var(--desk-2);overflow:hidden}
.cl-prog i{display:block;height:100%;background:var(--accent);border-radius:0}
.cl-got{margin:0;font:600 13px/1 var(--font-body);color:var(--moss)}
.shop{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.shop-row{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.shop-prev{width:56px;height:56px;display:grid;place-items:center}
.shop-prev .cl-svg{width:auto;height:100%}
.shop-t{display:grid;gap:2px;min-width:0}
.shop-t b{font:600 14px/1.25 var(--font-body)}
.shop-t span{font:12.5px/1.3 var(--font-body);color:var(--ink-3)}
.hanko-prev{width:40px;height:40px;display:grid;place-items:center;background:#D8432F;color:#FBFAF6;font:700 22px/1 var(--font-mincho);border-radius:0;transform:rotate(5deg)}
.paper-prev{width:52px;display:block}
.paper-prev .postcard{padding:12px 6px 6px;transform:scale(1);font-size:0}
.paper-prev .pc-text{font-size:10px;line-height:14px}
.paper-prev .rc-head,.paper-prev .tk-head{font-size:6px;margin-bottom:3px;padding-bottom:3px}
.paper-prev .tape{width:26px;height:9px;top:-5px}
.welcome{display:grid;gap:12px;justify-items:center;text-align:center;padding-top:6px}
.welcome-stamp{width:min(62%,230px);transform:rotate(-3deg);margin:4px 0 8px}
.welcome .lede{margin:0;max-width:30ch}
.welcome-btns{display:grid;gap:8px;width:100%;margin-top:6px;justify-items:center}
.after-card{margin-top:18px;padding:16px;border:1.5px dashed var(--mustard);border-radius:0;display:grid;gap:8px}
.after-card .eyebrow{margin:0}
.after-t{margin:0;font:var(--dw) 18px/1.3 var(--font-display)}
.after-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.saved-ev{display:grid;gap:4px;width:100%;text-align:left;border:0;cursor:pointer;background:var(--fc);color:var(--fc-ink);border-radius:0;padding:14px 16px}
.saved-ev b{font:var(--dw) 18px/1.2 var(--font-display)}
.saved-ev span{font:12px/1.3 var(--font-body);letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.checks{display:grid;gap:6px}
.snap-preview[hidden]{display:none}
.sample-tag{font:500 10px/1 var(--font-body);letter-spacing:.06em;padding:3px 6px;border-radius:0;border:1px solid var(--line);color:var(--ink-3);margin-left:6px;vertical-align:middle}
.mock-conn{display:grid;gap:10px;padding:14px;border:1.5px dashed var(--line);border-radius:0}
.mock-conn p{margin:0;font-size:14px;color:var(--ink-2)}
.mock-conn .btn{justify-self:start}
.sample-tag{display:inline-block;margin-left:6px;padding:0 5px;border:1px solid var(--line);border-radius:0;font-size:10.5px;line-height:1.4;color:var(--ink-3);vertical-align:1px}
/* Organizer view */
.org-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.org-stat{padding:12px 14px;border-radius:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.org-stat b{display:block;font:var(--dw) 28px/1.1 var(--font-display);font-variant-numeric:tabular-nums}
.org-stat span{font-size:12.5px;color:var(--ink-3)}
.org-list{list-style:none;margin:0;padding:0;display:grid}
.org-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.org-list .t{font-weight:500;overflow-wrap:anywhere}
.org-list .m{font-size:12.5px;color:var(--ink-3)}
.org-list a{font-size:13.5px;color:var(--accent);font-weight:500}
/* Wrapped */
.wrapped{display:grid;gap:14px;margin-top:34px}
.wslide{min-height:330px;border-radius:0;padding:22px 20px 20px;display:grid;align-content:space-between;gap:18px;background:var(--fc);color:var(--fc-ink);animation:up .3s ease}
.w-k{margin:0;font:500 12px/1.3 var(--font-body);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.w-big{font:var(--dw) 60px/1 var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.w-big.is-name{font-size:42px;line-height:1.05}
.w-line{margin:8px 0 0;font:var(--dw) 21px/1.25 var(--font-display);text-wrap:balance}
.w-sub{margin:0;font-size:15px;opacity:.9}
.wnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wdots{display:flex;gap:6px}
.wdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.wdots i.on{background:var(--ink)}
.view-head .head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}

/* Weeks: a strip of tiny perforated stamps, one per week. */
.view-head{grid-template-columns:minmax(0,1fr)}
.weeks-card{margin-top:16px;background:var(--raised);border-radius:0;padding:16px;box-shadow:inset 0 0 0 1px var(--line);display:grid;gap:12px}
.wc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.wc-total{display:block;font:var(--dw) 44px/1 var(--font-display);margin:2px 0 4px;font-variant-numeric:tabular-nums}
.wc-run{flex:none;display:grid;place-items:center;align-content:center;width:72px;height:72px;border-radius:50%;border:2px dashed currentColor;text-align:center;font:9.5px/1.15 var(--font-body);letter-spacing:.06em;text-transform:uppercase;transform:rotate(-9deg)}
.wc-run b{display:block;font:var(--dw) 26px/1 var(--font-display);letter-spacing:0}
.wc-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.wkstrip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px}
.wkstrip.is-all{grid-template-columns:repeat(11,minmax(0,1fr));margin-top:14px}
.wk{aspect-ratio:4/5;padding:2.5px;background:var(--paper);border:2px dotted var(--surface);display:block;border-radius:0}
.weeks-card .wk{border-color:var(--raised)}
.wk i{display:grid;place-items:center;width:100%;height:100%;font:800 6.5px/1 var(--font-body);letter-spacing:0;font-style:normal;color:#FBFAF6;overflow:hidden}
.wk-s i{background:var(--wk)}
.wk-d i{background:#B8452F}
.wk-m{background:transparent;border:1.5px dashed var(--ink-3);opacity:.45;padding:0}
.wk-o{background:transparent;border:1.5px dashed var(--ink-3);padding:0}
.wk-o i{color:var(--ink-3);animation:wkpulse 1.6s ease-in-out infinite}
@keyframes wkpulse{50%{opacity:.35}}
.wk-big{display:flex;gap:28px;margin-top:10px}
.wk-big div{display:grid}
.wk-big b{font:var(--dw) 40px/1 var(--font-display);font-variant-numeric:tabular-nums}
.wk-big span{font-size:13px;color:var(--ink-2)}
.chapters,.up-list,.notif-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.chapters li{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:baseline;padding:10px 12px;border-radius:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);font-size:14px}
.chapters li.is-now{box-shadow:inset 0 0 0 1.5px var(--ink)}
.ch-n{font-weight:600}
.up-list li{display:flex;gap:10px;align-items:center;font-size:14px}
.up-tag{margin-left:auto;font:500 11.5px/1 var(--font-body);padding:5px 8px;border-radius:0;border:1.5px dashed var(--line);color:var(--ink-3)}
.up-tag.is-in{border:0;background:var(--ink);color:var(--desk)}
.streak{cursor:pointer;color:inherit;background:none;padding:0}
.avs .av.is-out{opacity:.5;box-shadow:0 0 0 2px var(--fc),inset 0 0 0 1.5px currentColor}

/* Mail day */
.mail-card{display:flex;align-items:center;gap:12px;margin-top:12px;padding:14px;border-radius:0;background:var(--paper);color:var(--paper-ink);box-shadow:var(--shadow)}
.mail-ic{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:#B8452F;color:#FBFAF6}
.mail-ic .i{width:22px;height:22px}
.mail-t{flex:1;min-width:0;display:grid;gap:2px}
.mail-t b{font:var(--dw) 26px/1 var(--font-display);font-variant-numeric:tabular-nums}
.mail-t .muted{color:var(--paper-ink-2)}
.mailday{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.mailday h2{padding:0}
.md-env{position:relative;width:200px;height:132px;margin:64px auto 6px;perspective:600px}
.env-back,.env-front,.env-flap{position:absolute;left:0;right:0}
.env-back{top:0;bottom:0;background:#D9CFBC;border-radius:0}
.env-front{bottom:0;height:100%;background:linear-gradient(to top right,#E9E1D0 50%,transparent 50.5%) left/50.5% 100% no-repeat,linear-gradient(to top left,#E4DBC8 50%,transparent 50.5%) right/50.5% 100% no-repeat;border-radius:0;z-index:3}
.env-flap{top:0;height:62%;background:#D2C6AF;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .55s cubic-bezier(.4,0,.2,1);z-index:4}
.env-letter{position:absolute;left:12px;right:12px;top:12px;bottom:10px;background:var(--paper);color:var(--paper-ink);border-radius:0;display:grid;align-content:start;justify-items:center;gap:3px;padding-top:14px;font:600 13px/1.2 var(--font-display);z-index:2;transition:transform .6s .35s cubic-bezier(.3,1.3,.5,1)}
.env-letter span+span{font:11px var(--font-body);color:var(--paper-ink-2)}
.env-seal{position:absolute;left:50%;top:52%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#B8452F;color:#FBFAF6;display:grid;place-items:center;font:700 15px/1 var(--font-mincho);z-index:5;box-shadow:0 2px 0 rgba(0,0,0,.15);transition:opacity .25s,transform .25s}
.md-env.is-open .env-seal{opacity:0;transform:scale(1.4)}
.md-env.is-open .env-flap{transform:rotateX(180deg);z-index:1}
.md-env.is-open .env-letter{transform:translateY(-58%)}
.md-streak{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center;padding:12px;border-radius:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.md-old,.md-new{font:var(--dw) 30px/1 var(--font-display);font-variant-numeric:tabular-nums}
.md-old{color:var(--ink-3)}
.md-streak.is-up .md-new{animation:mdpop .6s 1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes mdpop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
.md-arrow{color:var(--ink-3)}
.md-lbl{flex-basis:100%;font-size:13.5px;color:var(--ink-2)}
.md-you{text-align:center;margin:0}
.md-rows{display:grid;gap:14px;margin-top:6px}
.md-who{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:6px}

/* Sealed envelopes for invites that haven't been opened */
.envs,.fs-envs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.fs-envs{justify-content:center}
.env-sm{display:grid;justify-items:center;gap:4px;border:0;background:none;padding:0;cursor:pointer;color:inherit;font:500 11.5px/1 var(--font-body)}
.env-sm-art{position:relative;width:38px;height:26px;background:#E9E1D0;border-radius:0;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.18)}
.env-sm-art::before{content:'';position:absolute;inset:0 0 35% 0;background:#D2C6AF;clip-path:polygon(0 0,100% 0,50% 100%)}
.env-sm-art i{position:absolute;left:50%;top:58%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#B8452F}
.md-env.is-sealed .env-letter{transform:none}
.wall-empty{column-span:all;margin-top:6px}

/* Reactions */
.reacts{display:flex;gap:8px}
.react{border:1.5px solid var(--line);background:var(--raised);color:var(--ink);border-radius:0;padding:7px 13px;font:500 13.5px/1 var(--font-body);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.react span{font-size:12px;color:var(--ink-3)}
.react[aria-pressed="true"]{background:var(--ink);color:var(--desk);border-color:var(--ink)}
.react[aria-pressed="true"] span{color:inherit;opacity:.7}

/* First open */
.first{display:grid;gap:12px;padding-top:4px}
.first h2{padding:0}
.first .welcome-btns{margin-top:4px}
.first .welcome-stamp{margin:6px auto;transform:rotate(-3deg)}
.first-srcs{display:flex;flex-wrap:wrap;gap:8px}
.first-srcs .add-btn[aria-pressed="true"]{background:var(--ink);color:var(--desk);border-color:var(--ink)}
.bf-head{font:var(--dw) 24px/1.2 var(--font-display)}
.bf-n{font-variant-numeric:tabular-nums;color:var(--accent)}
.bf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
.bf-item{animation:bfdrop .55s var(--d) cubic-bezier(.2,1.3,.4,1) both}
.bf-item:nth-child(3n+1){transform:rotate(-2deg)}
.bf-item:nth-child(3n+2){transform:rotate(1.5deg)}
@keyframes bfdrop{0%{transform:translateY(-28px) rotate(-8deg) scale(1.1);opacity:0}100%{opacity:1}}
.fs-friends li .btn{margin-left:auto}
.fs-dots{justify-content:center;margin-top:6px}

/* Notification switches */
.notif-list{margin:14px 0}
.notif-list li{display:flex;align-items:center;gap:12px;padding:12px;border-radius:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.notif-list li div{display:grid;gap:3px;flex:1;font-size:14px}
.switch{flex:none;width:44px;height:26px;border-radius:0;border:0;background:var(--line);position:relative;cursor:pointer;padding:0}
.switch i{position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--raised);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--moss)}
.switch[aria-checked="true"] i{transform:translateX(18px)}
.about p+p{margin-top:6px}

/* ---------- Rework (Nov 3): calmer labels, real work inside stamps, newest first ---------- */
.eyebrow{text-transform:none;letter-spacing:0;font:500 13px/1.4 var(--font-body);color:var(--ink-3)}
.sec{margin:26px 0 10px;font:var(--dw) 18px/1.2 var(--font-display)}
.sec-note{margin:-6px 0 10px}
.wall-head{margin-top:22px}
.art-type{position:absolute;inset:0;background:var(--at);color:var(--at-ink);display:flex;flex-direction:column;justify-content:space-between;padding:8%}
.at-src{font:500 clamp(9px,6cqi,13px)/1.2 var(--font-body);opacity:.8}
.at-num{font:500 clamp(9px,6.5cqi,15px)/1.1 var(--font-body)}
.at-num b{display:block;font:var(--dw) clamp(15px,17cqi,52px)/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap;margin-bottom:.15em}
.art-page{position:absolute;inset:0;background:#FBF8F0;color:#2A2A30;padding:8% 9%;display:grid;align-content:start;gap:.5em;overflow:hidden;box-shadow:inset 3px 0 0 var(--at)}
.art-page .ap-k{font:500 clamp(8px,5cqi,12px)/1 var(--font-body);color:#85858B}
.art-page p{margin:0;font:clamp(8px,6.4cqi,17px)/1.45 var(--font-stamp);display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.proof-thumb .art{container-type:inline-size}
.rec-cell .art-page p{font-size:3px}
.stamp-art{container-type:inline-size}
.art-term{position:absolute;inset:0;background:#15161B;color:#B9E6B4;padding:8%;display:flex;flex-direction:column;gap:.35em;font:clamp(7px,4cqi,13px)/1.35 ui-monospace,"SF Mono",Menlo,monospace;overflow:hidden}
.art-term span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art-term .cmd{color:#F1F0EB}
.wall2{margin-top:10px}
.feature .item{margin-bottom:18px}
.feature .item,.grid2 .item{--tilt:0deg!important}
.feature .stamp-title{font-size:17px}
.feature .stamp-denom b{font-size:26px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.grid2 .item{margin:0}
.by-flag{font:500 11px/1 var(--font-body);padding:3px 7px;border-radius:0;background:var(--ink);color:var(--desk)}
.snapstrip{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x mandatory}
.snapstrip .item{flex:0 0 148px;margin:0;scroll-snap-align:start}
.record{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rec-sheet{display:grid;gap:4px;text-align:left;border:0;cursor:pointer;background:var(--paper);color:var(--paper-ink);padding:10px;border-radius:0;box-shadow:var(--shadow);font:inherit}
.rec-cells{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:4px}
.rec-cell{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--desk-2);container-type:inline-size}
.rec-cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rec-cell .art-type{padding:6%}
.rec-cell .art-type .at-src{display:none}
.rec-cell .at-num{font-size:0}
.rec-cell .at-num b{font-size:clamp(7px,20cqi,13px);margin:0}
.rec-cell .art-term{font-size:4px;padding:6%}
.rec-t{font:600 13.5px/1.2 var(--font-body)}
.rec-m{font:12px/1.2 var(--font-body);color:var(--paper-ink-2)}
.rec-grid{margin-top:4px}
.weeks-line{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;width:100%;margin-top:12px;padding:14px;border:0;border-radius:0;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font:14px/1.3 var(--font-body);cursor:pointer;text-align:left}
.weeks-line b{font:var(--dw) 20px/1 var(--font-display);margin-right:4px}
.wl-go{margin-left:auto;align-self:center;padding:7px 12px;border-radius:0;background:var(--ink);color:var(--desk);font:500 13px/1 var(--font-body)}
.field > label:not(.dropzone),.field > legend,.lbl,.private-label,.about .about-k,.crew-kind,.saved-ev span,.cell-empty{text-transform:none;letter-spacing:0;font-size:13px;font-weight:500}
.private-label{font-weight:600}
.me-links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.add-row .lbl{display:none}

/* First open: full screen, one idea per screen */
body.onb-open{overflow:hidden}
.onb{position:fixed;inset:0;z-index:70;background:var(--desk);color:var(--ink);overflow:auto;-webkit-overflow-scrolling:touch}
.onb-in{min-height:100%;max-width:480px;margin:0 auto;padding:max(14px,env(safe-area-inset-top,0px)) 22px 0;display:flex;flex-direction:column;box-sizing:border-box}
.onb-top{display:grid;grid-template-columns:60px 1fr 60px;align-items:center;min-height:44px}
.onb-top .link-btn{font-size:15px;color:var(--ink-2);text-decoration:none}
.onb-top .link-btn:last-child{justify-self:end}
.onb-dots{justify-content:center}
.onb-body.no-anim,.onb-body.no-anim *{animation:none!important}
.onb-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:20px 0 30px;animation:onbIn .4s cubic-bezier(.2,.8,.3,1) both}
@keyframes onbIn{from{opacity:0;transform:translateY(14px)}}
.onb h1{margin:0;font:var(--dw) clamp(30px,8.4vw,40px)/1.08 var(--font-display);letter-spacing:-.01em}
.onb .lede{font-size:17px;line-height:1.45;max-width:none}
.onb-foot{position:sticky;bottom:0;display:grid;gap:12px;justify-items:center;padding:10px 0 max(20px,env(safe-area-inset-bottom,0px));background:var(--desk);box-shadow:0 -16px 14px -6px var(--desk)}
.onb-foot .btn{width:100%;padding:16px;font-size:16px;border-radius:0}
.onb-alt{font-size:15px;color:var(--ink-2);justify-self:center}
.onb h1:focus{outline:none}
.onb-fan{position:relative;height:clamp(190px,48vw,240px);margin:0 auto 8px;width:100%}
.onb-fan-i{position:absolute;left:50%;top:50%;width:min(38%,170px);transform:translate(-50%,-50%) translateX(calc((var(--j) - 1) * 50%)) rotate(calc((var(--j) - 1) * 8deg));animation:fanIn .6s calc(var(--j) * 120ms) cubic-bezier(.2,1.3,.4,1) both}
.onb-fan-i:nth-child(2){z-index:2;width:min(44%,195px)}
@keyframes fanIn{from{opacity:0;margin-top:30px}}
.src-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.src-tile{position:relative;display:grid;gap:4px;text-align:left;padding:16px 40px 16px 14px;border-radius:0;border:0;background:var(--raised);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);cursor:pointer;font:inherit}
.src-tile b{font:600 16px/1.2 var(--font-body)}
.src-tile span{font-size:13px;color:var(--ink-3)}
.src-tile[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.tick{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line)}
[aria-pressed="true"] > .tick{background:var(--ink);box-shadow:none}
[aria-pressed="true"] > .tick::after{content:'';position:absolute;left:7px;top:4px;width:5px;height:9px;border:solid var(--desk);border-width:0 2px 2px 0;transform:rotate(45deg)}
.bf-hero{display:grid;gap:4px}
.bf-hero .bf-n{font:var(--dw) clamp(84px,26vw,120px)/.9 var(--font-display);color:var(--accent);font-variant-numeric:tabular-nums}
.onb .bf-grid{gap:12px}
.field input{font-size:16px}
.onb-people{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.onb-person{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-radius:0;background:var(--raised);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);font:500 16px/1.2 var(--font-body);cursor:pointer;text-align:left}
.onb-person .tick{top:50%;margin-top:-10px;right:14px}
.onb-person[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.onb-env{transform:scale(1.2);margin:36px auto 26px}
@media (max-height:700px){.onb-env{transform:none;margin:10px auto 4px}.onb-fan{height:170px}.onb h1{font-size:30px}}

/* The first open lives in the wall */
.starter{display:grid;gap:10px;margin-bottom:22px}
.ss-host{display:flex;align-items:center;gap:8px;margin:0;font-size:14px;color:var(--ink-2)}
.starter-slot{display:grid;gap:12px;justify-items:start;padding:22px 18px;border-radius:0;border:2px dashed var(--ink-3);background:var(--raised);color:var(--ink);min-height:220px;align-content:center}
.starter-slot.is-pick{align-content:start}
.ss-t{margin:0;font:var(--dw) 24px/1.15 var(--font-display)}
.ss-s{margin:0;font-size:15.5px;color:var(--ink-2);line-height:1.45}
.ss-btns{display:flex;gap:10px;flex-wrap:wrap}
.ss-btns .btn{padding:12px 16px;font-size:15px}
.ss-more{display:flex;gap:8px;flex-wrap:wrap}
.ss-pick{width:100%}
.ss-item{border:0;background:none;padding:0;cursor:pointer;text-align:left;transition:transform .15s}
.ss-item:active{transform:scale(.96)}
.tip{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding:12px 12px 12px 14px;border-radius:0;background:var(--paper);color:var(--paper-ink);box-shadow:var(--shadow)}
.tip .mail-ic{width:36px;height:36px}
.tip .mail-ic .i{width:18px;height:18px}
.tip p{margin:0;flex:1;font-size:14px;line-height:1.4}
.tip .icon-btn{color:var(--paper-ink-2)}

/* Snaps are postcards */
.pcard{position:relative;container-type:inline-size;border-radius:0;overflow:hidden;aspect-ratio:4/5;background:#2A2A30;box-shadow:0 1px 1px var(--drop),0 8px 16px var(--drop)}
.pcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pc-mini{position:absolute;top:5cqi;right:5cqi;width:16cqi;aspect-ratio:5/6;padding:1.3cqi;background:#FBFAF6;border:1px dotted rgba(0,0,0,.35);box-sizing:border-box;box-shadow:0 1px 3px rgba(0,0,0,.35);z-index:2}
.pc-mini i{display:grid;place-items:center;width:100%;height:100%;background:var(--h);color:var(--hi);font:700 7.5cqi/1 var(--font-body);font-style:normal}
.pc-cancel{position:absolute;width:47cqi;display:flex;flex-direction:column;align-items:flex-start;gap:2cqi;z-index:1}
.pos-tl .pc-cancel{top:5cqi;left:5cqi}
.pos-tr .pc-cancel{top:5cqi;right:5cqi;align-items:flex-end}
.pos-bl .pc-cancel{bottom:5cqi;left:5cqi;flex-direction:column-reverse}
.pos-br .pc-cancel{bottom:5cqi;right:5cqi;align-items:flex-end;flex-direction:column-reverse}
.pc-cancel .pc-slogan{width:100%}
.pos-tr .pc-mini{right:auto;left:5cqi}
.pc-slogan p{font-size:6.2cqi!important;line-height:1.15!important}
.pc-slogan p span{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.pc-slogan.sl-l p{font-size:7.2cqi!important}
.pc-slogan.sl-s p{font-size:5cqi!important}
.pc-cancel.is-long{width:56cqi}
.lbl-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.count{font:500 12.5px var(--font-body);color:var(--ink-3);font-variant-numeric:tabular-nums}
.count.is-near{color:var(--ink)}
.corner{display:block;width:16px;height:16px;border:1.5px solid currentColor;border-radius:0;position:relative}
.corner::after{content:'';position:absolute;width:6px;height:6px;background:currentColor;border-radius:0}
.c-tl::after{top:1.5px;left:1.5px}.c-tr::after{top:1.5px;right:1.5px}.c-bl::after{bottom:1.5px;left:1.5px}.c-br::after{bottom:1.5px;right:1.5px}
#sn-place button{display:grid;place-items:center;min-width:44px}
.ink-light .pc-cancel{color:#FFFFFF;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.ink-dark .pc-cancel{color:#1B1B20;filter:drop-shadow(0 0 2px rgba(255,255,255,.55))}
.pc-ring{flex:none;width:22cqi;height:22cqi;transform:rotate(-8deg)}
.pc-slogan{flex:1;min-width:0;display:grid;gap:1.6cqi}
.pc-wave{display:block;width:100%;height:3.4cqi}
.pc-slogan p{margin:0;border:1.5px solid currentColor;padding:2.2cqi 2.6cqi;font:800 6cqi/1.22 var(--font-body);letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere}
.pcard.is-back{color:#2A2A30}
.is-back > .pc-in{position:absolute;inset:0;background:#F7F2E6;padding:8cqi 7cqi 7cqi;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box}
.pc-backmark{position:absolute;top:3cqi;right:15cqi;color:rgba(42,42,48,.7)}
.pc-backmark .pc-ring{width:26cqi;height:26cqi;transform:rotate(10deg)}
.pc-note{margin:20cqi 0 0;flex:0 1 auto;min-height:0;font:600 9.6cqi/1.24 var(--font-body);letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pc-addr{display:grid;gap:3cqi;font:500 6.2cqi/1.2 var(--font-body);color:rgba(42,42,48,.75)}
.pc-addr span{border-bottom:1px solid rgba(42,42,48,.22);padding-bottom:1.6cqi;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snapstrip .item{flex-basis:200px}
.sn-card{width:min(100%,260px);margin:12px auto 4px}
#sn-place{justify-content:center}
.detail-visual.is-card .pcard{width:min(100%,360px);margin:0 auto}
.paper-prev .pcard{width:52px}
.rec-cell .pcard{border-radius:0;box-shadow:none}

.pb-leaves{position:absolute!important;inset:0;width:100%;height:100%;z-index:0!important}

/* Commit message in plain words, and what the stamp's number should say. */
const VERB_PAST = {add:'Added', adds:'Added', fix:'Fixed', fixes:'Fixed', remove:'Removed', removes:'Removed', delete:'Deleted', update:'Updated', updates:'Updated', make:'Made', build:'Built', ship:'Shipped', improve:'Improved', refactor:'Cleaned up', rewrite:'Rewrote', move:'Moved', rename:'Renamed', create:'Created', implement:'Built', support:'Supported'};

function plainWords(src){
  let t = String(src || '').split('\n')[0].trim();
  t = t.replace(/^(feat|fix|chore|refactor|docs|style|perf|test|tests|build|ci|wip)(\([^)]*\))?!?:\s*/i, '').replace(/\s*\(#\d+\)\s*$/, '').replace(/[.!]+$/, '');
  JARGON.forEach(([re, w]) => { t = t.replace(re, w); });
  const m = t.match(/^(\w+)\b(.*)$/); if(m && VERB_PAST[m[1].toLowerCase()]) t = VERB_PAST[m[1].toLowerCase()] + m[2];
  t = t.charAt(0).toUpperCase() + t.slice(1);
  return t.slice(0, 80);
}
function commitStat(c){
  const add = c.add || 0, del = c.del || 0, files = c.files || 0, msg = String(c.message || '').toLowerCase();
  const balanced = add + del > 600 && Math.min(add, del) / Math.max(add, del, 1) > .85 && files >= 8;
  if(/\b(format|formatt?ing|prettier|lint|rename[ds]?|reindent|whitespace)\b/.test(msg) || balanced) return {stat:String(files || 1), unit:files === 1 ? 'file tidied' : 'files tidied', mark:null};
  if(del > 40 && del > add * 2) return {stat:'−' + (del - add).toLocaleString(), unit:'lines cut', mark:'cut'};
  return {stat:'+' + add.toLocaleString(), unit:'lines', mark:null};
}

  if(cur) store.set('kq-crew', cur);
  await signUrls(crews.map(c => c.cover_path).filter(Boolean));
}
async function loadCrew(){
  members = []; posts = []; reacts = [];
  if(!cur) return;
  const m = await q(sb.from('crew_members').select('user_id, joined_at').eq('crew_id', cur));
  members = m.map(x => x.user_id); memberSince = {}; m.forEach(x => { memberSince[x.user_id] = x.joined_at; });
  const need = members.filter(id => !people[id]);
  if(need.length) (await q(sb.from('profiles').select('*').in('id', need))).forEach(p => { people[p.id] = p; });
  const pc = await q(sb.from('post_crews').select('post_id').eq('crew_id', cur));
  const ids = pc.map(x => x.post_id);
  posts = ids.length ? await q(sb.from('posts').select('*').in('id', ids).order('created_at', {ascending:false}).limit(200)) : [];
  posts.forEach(p => { p._crew = cur; });
  const authors = [...new Set(posts.map(p => p.author))].filter(id => !people[id]);
  if(authors.length) (await q(sb.from('profiles').select('*').in('id', authors))).forEach(p => { people[p.id] = p; });
  reacts = ids.length ? await q(sb.from('reactions').select('*').in('post_id', ids)) : [];
  await signUrls(posts.map(p => p.image_path).filter(Boolean));
}
async function signUrls(paths){
  const soon = Date.now() + 5 * 60000, need = [...new Set(paths)].filter(p => !urls[p] || urls[p].exp < soon);
  if(!need.length) return;
  const res = await q(sb.storage.from('snaps').createSignedUrls(need, 3600));
  (res || []).forEach(r => { if(r.signedUrl) urls[r.path] = {url:r.signedUrl, exp:Date.now() + 3600e3}; });
}
async function refresh(all){

}

function goLive(){

  live = sb.channel('kq-live')

    .subscribe();
