/* ====== Weeks, crew streaks and mail day ======
   A week closes Sunday 8pm. Posts before Monday 9am still count for the week that just closed.
   Ship anything once a week. Total weeks never goes down; a missed week ends a run (a chapter), unless a Postage Due covers it. */
const HOUR = 36e5, WK = 7 * DAY;
const ENV_SVG = `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg>`;
function nextClose(t){ const d = new Date(t), e = new Date(d); e.setHours(20, 0, 0, 0); e.setDate(e.getDate() + ((7 - e.getDay()) % 7)); if(e <= d) e.setDate(e.getDate() + 7); return e; }
function weekEnd(t){ const e = nextClose(t), prev = new Date(e); prev.setDate(prev.getDate() - 7); return (new Date(t) - prev) < 13 * HOUR ? prev : e; }
const wkKey = d => new Date(d).toDateString();
const lastClose = () => { const p = nextClose(Date.now()); p.setDate(p.getDate() - 7); return p; };
const md = t => new Date(t).toLocaleDateString('en-US', {month:'short', day:'numeric'});
function runInfo(times){
  const cur = nextClose(Date.now()), keys = new Set(times.map(t => wkKey(weekEnd(t))));
  const log = [], chapters = []; let run = 0, total = 0, freezes = 0, since = 0, from = null, last = null;
  if(times.length){
    const first = new Date(Math.min(...times.map(t => weekEnd(t).getTime())));
    for(const d = new Date(first); d < cur; d.setDate(d.getDate() + 7)){
      if(keys.has(wkKey(d))){ total++; run++; since++; from = from || new Date(d); last = new Date(d); if(since >= 4){ freezes = Math.min(freezes + 1, 2); since = 0; } log.push('s'); }
      else if(run > 0 && freezes > 0){ freezes--; log.push('d'); }
      else { if(run > 0) chapters.push({weeks:run, from, to:last}); run = 0; since = 0; from = null; log.push('m'); }
    }
  }
  const now = keys.has(wkKey(cur)); if(now){ total++; run++; } log.push(now ? 's' : 'o');
  while(log.length < 12) log.unshift('b');
  return {total, run, freezes, chapters:chapters.reverse(), log:log.slice(-12), shippedNow:now};
}
function wkCell(c, i, n, color){
  const back = n - 1 - i, label = {s:'Shipped', d:'Saved by Postage Due', m:'Missed', o:'This week, still open', b:'Before you started'}[c];
  return `<span class="wk wk-${c === 'b' ? 'm is-before' : c}" style="--wk:${color}" role="img" aria-label="${back === 0 ? 'This week' : back + (back === 1 ? ' week' : ' weeks') + ' ago'}: ${label}"><i>${c === 'd' ? 'DUE' : c === 'o' ? 'now' : ''}</i></span>`;
}
/* Who showed up in a crew, week by week: a post or a reaction counts. */
function crewActivity(){
  const act = {};
  const add = (id, t) => { const k = wkKey(weekEnd(t)); (act[k] = act[k] || new Set()).add(id); };
  posts.forEach(p => add(p.author, p.created_at)); reacts.forEach(r => add(r.user_id, r.created_at));
  return act;
}
function crewStreak(upTo){
  const act = crewActivity(), d = new Date(upTo || lastClose()); let n = 0;
  for(let i = 0; i < 52; i++){
    const start = new Date(d); start.setDate(start.getDate() - 7);
    const need = members.filter(id => !memberSince[id] || new Date(memberSince[id]) < start);
    if(need.length < 2) break;
    const got = act[wkKey(d)] || new Set();
    if(!need.every(id => got.has(id))) break;
    n++; d.setDate(d.getDate() - 7);
  }
  return n;
}
function mailKey(c){ return `kq-mail-${c.id}-${wkKey(lastClose())}`; }
function lastWeekPosts(){ const k = wkKey(lastClose()); return posts.filter(p => wkKey(weekEnd(p.created_at)) === k); }
function mailCardHTML(c){
  const diff = nextClose(Date.now()) - Date.now(), d = Math.floor(diff / DAY), h = Math.floor((diff % DAY) / HOUR), m = Math.floor((diff % HOUR) / 6e4);
  const arrived = new Date(c.created_at) < lastClose() && lastWeekPosts().length && !store.get(mailKey(c));
  return arrived
    ? `<div class="mail-card is-new"><span class="mail-ic">${ENV_SVG}</span><div class="mail-t"><p class="eyebrow">Mail day</p><b style="font-size:20px">Your crew's week arrived</b><span class="muted small">${md(new Date(lastClose()) - 6 * DAY)} to ${md(lastClose())}</span></div><button class="btn small" data-act="mailday">Open</button></div>`
    : `<div class="mail-card"><span class="mail-ic">${ENV_SVG}</span><div class="mail-t"><p class="eyebrow">Mail day</p><b>${d > 0 ? `${d}d ${h}h` : `${h}h ${m}m`}</b><span class="muted small">until this week arrives, Sunday 8pm</span></div></div>`;
}
function openMailDay(){
  const c = curCrew(); if(!c) return;
  const wk = lastWeekPosts(), end = lastClose(), start = new Date(end - 6 * DAY);
  const act = crewActivity()[wkKey(end)] || new Set(), need = members.filter(id => !memberSince[id] || new Date(memberSince[id]) < new Date(end - WK));
  const all = need.length >= 2 && need.every(id => act.has(id)), now = crewStreak(end), before = all ? now - 1 : crewStreak(new Date(end - WK));
  const authors = [...new Set(wk.map(p => p.author))];
  const rows = authors.map(a => { const ps = wk.filter(p => p.author === a).sort((x, y) => new Date(x.created_at) - new Date(y.created_at));
    return `<div class="md-row"><div class="md-who">${avatar(a)}<b>${esc(handleOf(a))}</b><span class="up-tag is-in">${ps.length} ${ps.length === 1 ? 'post' : 'posts'}</span></div><div class="mini-row">${ps.map(p => `<div class="hit" role="button" tabindex="0" data-act="open" data-id="${p.id}">${pieceHTML(p, 'sm')}</div>`).join('')}</div></div>`; }).join('');
  store.set(mailKey(c), '1');
  openSheet(`<div class="mailday">
    <div class="md-env" aria-hidden="true"><div class="env-back"></div><div class="env-letter"><span>${esc(c.name)}</span><span>${md(start)} to ${md(end)}</span></div><div class="env-front"></div><div class="env-flap"></div><span class="env-seal">組</span></div>
    <p class="eyebrow" style="text-align:center">Mail day · ${md(start)} to ${md(end)}</p>
    <h2 id="sheet-title" style="text-align:center">The week, all together</h2>
    <div style="display:flex;justify-content:center">${crewChip(c)}</div>
    ${need.length >= 2 ? `<div class="md-streak ${all ? 'is-up' : ''}"><span class="md-old">${before}</span><span class="md-arrow" aria-hidden="true"></span><span class="md-new">${all ? now : 0}</span><span class="md-lbl">${all ? 'Everyone showed up. Crew streak up.' : 'A quiet week for some. The streak starts fresh this week.'}</span></div>` : ''}
    <div class="md-rows">${rows || '<p class="muted" style="text-align:center">A quiet week.</p>'}</div></div>`);
  const env = $('.md-env'); if(env) requestAnimationFrame(() => setTimeout(() => env.classList.add('is-open'), 250));
  renderQuiet();
}
function weekViewHTML(){
  const r = runInfo(myTimes), c = curCrew(), color = c ? (HEX.test(safeColor(c.color)) ? c.color : `var(--${safeColor(c.color)})`) : 'var(--magenta)';
  const streak = c ? crewStreak() : 0;
  const shown = c ? new Set(posts.filter(p => isThisWeek(p.created_at)).map(p => p.author).concat(reacts.filter(x => isThisWeek(x.created_at)).map(x => x.user_id)).filter(id => members.includes(id))) : new Set();
  return `<section aria-label="Your weeks">
    <div class="view-head"><h1>Your weeks</h1></div>
    <div class="weeks-card">
      <div class="wc-top"><div><p class="eyebrow">Weeks shipped</p><b class="wc-total">${r.total}</b><p class="muted small" style="margin:0">This number never goes down.</p></div>
        <div class="wc-run"><b>${r.run}</b><span>week run</span></div></div>
      <div class="wkstrip">${r.log.map((x, i) => wkCell(x, i, r.log.length, color)).join('')}</div>
      <p class="muted small" style="margin:0">${r.shippedNow ? 'This week is in. See you next week.' : 'Ship anything this week (a stamp or a snap) to keep your run going.'}${r.freezes ? ` You have ${r.freezes} Postage Due saved for a week you miss.` : ''}</p>
      ${r.chapters.length ? `<details class="custom"><summary>Past runs <span>${r.chapters.length}</span></summary><ul class="chapters" style="margin-top:12px">${r.chapters.map((ch, i) => `<li><span class="ch-n">Chapter ${r.chapters.length - i}</span><span>${ch.weeks} ${ch.weeks === 1 ? 'week' : 'weeks'}</span><span class="muted small">ended ${md(ch.to)}</span></li>`).join('')}</ul></details>` : ''}
    </div>
    ${c ? `<h2 class="sec">${crewChip(c)}</h2>${mailCardHTML(c)}
      <div class="crew-line"><span><b>${streak}</b> ${streak === 1 ? 'week' : 'weeks'} crew streak</span><span class="muted">${members.length < 2 ? 'Crew streaks start when someone joins.' : `${shown.size} of ${members.length} showed up this week`}</span></div>
      <p class="muted small">A week counts for the crew when everyone posts or reacts.</p>` : ''}
  </section>`;
}

/* ====== Letters: private notes on a stamp, and requests ("ask for a change") ======
   Only the sender and the stamp's author ever see a letter. */
let letters = [], letterPosts = {};
async function loadLetters(){
  try{
    letters = await q(sb.from('letters').select('*').order('created_at', {ascending:false}).limit(200));
    const needP = [...new Set(letters.map(l => l.post_id))].filter(id => !posts.some(p => p.id === id) && !letterPosts[id]);
    if(needP.length) (await q(sb.from('posts').select('*').in('id', needP))).forEach(p => { letterPosts[p.id] = p; });
    const needU = [...new Set(letters.flatMap(l => [l.from_user, l.to_user]))].filter(id => !people[id]);
    if(needU.length) (await q(sb.from('profiles').select('*').in('id', needU))).forEach(p => { people[p.id] = p; });
    const ans = [...new Set(letters.map(l => l.answered_by).filter(id => id && !posts.some(p => p.id === id) && !letterPosts[id]))];
    if(ans.length) (await q(sb.from('posts').select('*').in('id', ans))).forEach(p => { letterPosts[p.id] = p; });
  }catch(e){ /* keep what we have */ }
  badge(); shippedToasts();
}
const postById = id => posts.find(p => p.id === id) || letterPosts[id];
const unread = () => letters.filter(l => l.to_user === me.id && !l.read_at);
const openRequests = () => letters.filter(l => l.to_user === me.id && l.is_request && !l.answered_by);
function badge(){ const b = $('#letters-badge'); if(!b) return; const n = unread().length; b.textContent = n > 9 ? '9+' : n; b.hidden = !n; }
/* "You asked, Maya shipped it." Shown once per answered request. */
function shippedToasts(){
  let seen = []; try{ seen = JSON.parse(store.get('kq-answered') || '[]'); }catch(e){}
  const fresh = letters.filter(l => l.from_user === me.id && l.is_request && l.answered_by && !seen.includes(l.id));
  if(!fresh.length) return;
  toast(`You asked, ${handleOf(fresh[0].to_user)} shipped it.`);
  store.set('kq-answered', JSON.stringify(seen.concat(fresh.map(l => l.id)).slice(-300)));
}
function letterHTML(l, withPost){
  const p = postById(l.post_id), mineSent = l.from_user === me.id, ans = l.answered_by && postById(l.answered_by);
  return `<li class="lt-item${!mineSent && !l.read_at ? ' is-new' : ''}"><div class="lt-head">${avatar(mineSent ? l.to_user : l.from_user, 'xs')}<span>${mineSent ? 'You to ' + esc(handleOf(l.to_user)) : esc(handleOf(l.from_user))}</span>${l.is_request ? '<span class="lt-tag">Request</span>' : ''}<span class="by-when">${rel(l.created_at)}</span></div>
    <p class="lt-body">${esc(l.body)}</p>
    ${withPost && p ? `<button class="lt-on" data-act="open" data-id="${p.id}">on ${esc(p.kind === 'ship' ? p.title || 'a stamp' : 'a snap')}</button>` : ''}
    ${l.is_request ? (l.answered_by ? `<p class="lt-done">✓ ${mineSent ? esc(handleOf(l.to_user)) + ' shipped it' : 'You shipped it'}${ans ? `: <button class="lt-on" data-act="open" data-id="${ans.id}">${esc(ans.title || 'see the stamp')}</button>` : ''}</p>` : `<p class="lt-open">${mineSent ? 'Waiting for the next stamp' : 'Tick it when you print the stamp that does it'}</p>`) : ''}</li>`;

async function markRead(ids){

  try{ await q(sb.from('letters').update({read_at:at}).in('id', ids)); letters.forEach(l => { if(ids.includes(l.id)) l.read_at = at; }); badge(); }catch(e){}

function openLetters(){
  const got = letters.filter(l => l.to_user === me.id), sent = letters.filter(l => l.from_user === me.id);
  openSheet(`<h2 id="sheet-title">Letters</h2><div class="sheet-body-grid"><p class="lead">Private notes on stamps. Only the two of you see them.</p>

    ${sent.length ? `<details class="custom"><summary>You sent <span>${sent.length}</span></summary><ul class="lt-list" style="margin-top:12px">${sent.map(l => letterHTML(l, true)).join('')}</ul></details>` : ''}</div>`);

async function sendLetter(form){
  const p = postById(form.dataset.post), body = (form.querySelector('textarea').value || '').trim(), req = form.querySelector('[name=req]').checked;
  if(!p || !body){ toast('Write something first.'); return; }

let stampDraft = null;
/* ---- Tray: your recent GitHub work, found on its own ---- */
let tray = null, myShas = new Set();
/* Commit messages people don't really write ("Add files via upload", "Update app.html", "wip").
   For those, the stamp describes the files that changed instead. */
const GENERIC = /^(add(ed)?\s+files?\s+via\s+upload|(update|updated|create|created|delete|deleted|rename|renamed|add|added)\s+[\w.\-\/ ]+\.\w+|initial\s+commit|first\s+commit|init|wip|fix(es|ed)?|updates?|updated|changes?|commit|stuff|test|tweaks?|\.+|-+)$/i;
const realMsg = c => (c.messages || []).map(m => String(m || '').split('\n')[0].trim()).find(m => m && !GENERIC.test(m)) || '';
const baseName = f => String(f).split('/').pop();
function filesTitle(files){
  if(!files || !files.length) return '';
  const verb = files.every(f => f.status === 'added') ? 'Added' : files.every(f => f.status === 'removed') ? 'Removed' : 'Updated';
  const n = [...new Set(files.map(f => baseName(f.name)))];
  const t = n.length === 1 ? n[0] : n.length === 2 ? `${n[0]} and ${n[1]}` : n.length === 3 ? `${n[0]}, ${n[1]} and ${n[2]}` : `${n[0]}, ${n[1]} and ${n.length - 2} more files`;
  return `${verb} ${t}`.slice(0, 80);
}
const repoName = r => String(r || '').split('/')[1] || r;
function sessionTitle(c){ const m = realMsg(c); return m ? plainWords(m) : c.diff ? filesTitle(c.diff.files) : `Worked on ${repoName(c.repo)}`; }
function sessionMeta(c){ return `${repoName(c.repo)} · ${c.n > 1 ? c.n + ' commits · ' : ''}${rel(c.at)}`; }
/* What changed, across every commit in the session: one call to GitHub. */
async function ensureDiff(c){
  if(c.diff) return c.diff;
  let d;
  if(c.n === 1) d = await gh(`/repos/${c.repo}/commits/${c.sha}`);
  else { const oldest = c.shas[c.shas.length - 1]; try{ d = await gh(`/repos/${c.repo}/compare/${oldest}^...${c.sha}`); }catch(e){ d = await gh(`/repos/${c.repo}/compare/${oldest}...${c.sha}`); } }
  const files = (d.files || []).map(f => ({name:f.filename, status:f.status, add:f.additions || 0, del:f.deletions || 0}));
  c.diff = {files, add:files.reduce((x, f) => x + f.add, 0), del:files.reduce((x, f) => x + f.del, 0)};
  return c.diff;
}
/* A "session" is your commits to one project on one day, newest first. */
function toSessions(commits){
  const groups = new Map();
  commits.forEach(c => { const day = new Date(c.at).toDateString(), k = c.repo + '|' + day;
    if(!groups.has(k)) groups.set(k, {repo:c.repo, sha:c.sha, shas:[], messages:[], at:c.at, n:0});
    const g = groups.get(k); g.shas.push(c.sha); g.messages.push(c.message); g.n++; });
  return [...groups.values()].sort((x, y) => new Date(y.at) - new Date(x.at));
}
async function loadTray(force){
  const login = profile && profile.github_login;
  if(!login){ tray = []; return; }
  try{
    const c = JSON.parse(store.get('kq-tray2') || 'null');
    if(!force && c && c.login === login && Date.now() - c.t < 20 * 60e3){ tray = c.items; return; }
  }catch(e){}
  try{
    const repos = (await gh(`/users/${login}/repos?sort=pushed&per_page=6&type=owner`)).filter(r => !r.fork).slice(0, 3);
    const lists = await Promise.all(repos.map(r => gh(`/repos/${r.full_name}/commits?author=${encodeURIComponent(login)}&per_page=10`)
      .then(cs => cs.map(c => ({repo:r.full_name, sha:c.sha, message:c.commit.message, at:c.commit.author && c.commit.author.date}))).catch(() => [])));
    tray = toSessions(lists.flat()).slice(0, 10);
    await Promise.all(tray.filter(x => !realMsg(x)).slice(0, 4).map(x => ensureDiff(x).catch(() => null)));
    store.set('kq-tray2', JSON.stringify({login, t:Date.now(), items:tray}));
  }catch(e){ tray = tray || []; }
}

async function gh(path){
  const r = await fetch('https://api.github.com' + path, {headers:ghToken ? {Authorization:'Bearer ' + ghToken, Accept:'application/vnd.github+json'} : {Accept:'application/vnd.github+json'}});

      return `<button class="react" data-act="react" data-id="${p.id}" data-v="${k}" aria-pressed="${on}">${label}${n ? ` <span>${n}</span>` : ''}</button>`; }).join('')}</div>
    ${rs.length ? `<p class="muted small">${[...new Set(rs.map(r => handleOf(r.user_id)))].map(esc).join(', ')}</p>` : ''}
    ${mine ? (ls => `<div class="field"><span class="lbl">Only you see this</span>${ls.length ? `<ul class="lt-list">${ls.map(l => letterHTML(l, false)).join('')}</ul>` : '<p class="muted small" style="margin:0">Letters from your crew about this stamp land here.</p>'}</div>`)(letters.filter(l => l.post_id === p.id && l.to_user === me.id))
      : `${(ls => ls.length ? `<ul class="lt-list">${ls.map(l => letterHTML(l, false)).join('')}</ul>` : '')(letters.filter(l => l.post_id === p.id && l.from_user === me.id))}
        <form class="letter-form" data-form="letter" data-post="${p.id}"><label class="lbl" for="lt-body">Write to ${esc(handleOf(p.author))}</label><textarea id="lt-body" rows="2" maxlength="1000"></textarea>
        <div class="lt-row"><label class="check"><input type="checkbox" name="req">Ask for a change</label><button class="btn small" type="submit">Send</button></div><p class="muted small" style="margin:0">Private. Only ${esc(handleOf(p.author))} sees it.</p></form>`}
    ${mine ? `<button class="btn ghost small danger" data-act="delete" data-id="${p.id}" style="justify-self:start">Delete</button>` : ''}</div>`);
  if(mine) markRead(letters.filter(l => l.post_id === p.id && l.to_user === me.id && !l.read_at).map(l => l.id));
}
async function toggleReact(id, kind, btn){
  const on = btn.getAttribute('aria-pressed') === 'true';
  btn.disabled = true;
  try{
    if(on) await q(sb.from('reactions').delete().match({post_id:id, user_id:me.id, kind}));
    else await q(sb.from('reactions').insert({post_id:id, kind}));
    reacts = await q(sb.from('reactions').select('*').in('post_id', posts.map(p => p.id)));
    openPost(id); renderQuiet();
  }catch(e){ toast(errMsg(e)); btn.disabled = false; }
}
async function deletePost(id, btn){
  if(!confirmDel){ confirmDel = true; btn.textContent = 'Tap again to delete'; return; }
  btn.disabled = true;
  try{
    const p = posts.find(x => x.id === id);
    await q(sb.from('posts').delete().eq('id', id));
    if(p && p.image_path) await sb.storage.from('snaps').remove([p.image_path]);
    closeSheet(); await loadCrew(); render(); toast('Deleted.');
  }catch(e){ toast(errMsg(e)); btn.disabled = false; }
}

/* ====== You ====== */
function openMe(){
  if(!profile) return;
  const c = curCrew();
  openSheet(`<h2 id="sheet-title">You</h2><form class="sheet-body-grid" data-form="me">
    <div class="me-head">${avatar(profile.id, 'lg')}<div><b>${esc(profile.name || profile.handle)}</b><span class="muted small">Signed in with GitHub${profile.github_login ? ' as ' + esc(profile.github_login) : ''}</span></div></div>
    <div class="field"><label for="me-handle">Username</label><input id="me-handle" maxlength="24" value="${esc(profile.handle)}" autocapitalize="off" autocomplete="off" spellcheck="false"><span class="muted small">3 to 24 letters, numbers or _. This is how your crew sees you.</span></div>
    <div class="field"><label for="me-name">Name</label><input id="me-name" maxlength="60" value="${esc(profile.name || '')}" autocomplete="name"></div>
    <button class="btn" type="submit" style="justify-self:start">Save</button>
    <hr style="border:0;border-top:1px solid var(--line);width:100%;margin:4px 0">
    ${c ? `<div class="invite-to"><span class="muted small">Current crew</span>${crewChip(c)}</div><button type="button" class="btn ghost small" data-act="leave" style="justify-self:start">Leave this crew</button>` : ''}
    <button type="button" class="btn ghost small" data-act="signout" style="justify-self:start">Sign out</button></form>`);
}
async function saveMe(){
  const handle = ($('#me-handle').value || '').trim().toLowerCase(), name = ($('#me-name').value || '').trim();
  if(!/^[a-z0-9_]{3,24}$/.test(handle)){ toast('Usernames are 3 to 24 letters, numbers or _.'); return; }
  try{
    await q(sb.from('profiles').update({handle, name:name || null}).eq('id', me.id));
    profile = {...profile, handle, name:name || null}; people[me.id] = profile; closeSheet(); render();
  }catch(e){ toast(errMsg(e)); }
}
let confirmLeave = false;
async function leaveCrew(btn){
  const c = curCrew(); if(!c) return;
  if(!confirmLeave){ confirmLeave = true; btn.textContent = 'Tap again to leave'; return; }
  confirmLeave = false;
  try{ await q(sb.from('crew_members').delete().match({crew_id:c.id, user_id:me.id})); cur = null; closeSheet(); await loadCrews(); await loadCrew(); render(); toast('You left the crew.'); }
  catch(e){ toast(errMsg(e)); }
}

/* ====== Events ====== */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, id = el.dataset.id, v = el.dataset.v;
  switch(act){
    case 'close': closeSheet(); break;
    case 'retry': location.reload(); break;
    case 'signin': el.disabled = true; try{ await q(sb.auth.signInWithOAuth({provider:'github', options:{redirectTo:APP_URL}})); }catch(err){ toast(errMsg(err)); el.disabled = false; } break;
    case 'signout': closeSheet(); await sb.auth.signOut(); profile = null; people = {}; crews = []; cur = null; break;
    case 'crew': cur = id; store.set('kq-crew', id); render(); try{ await loadCrew(); render(); }catch(err){ toast(errMsg(err)); } break;
    case 'new-crew': openNewCrew(); break;
    case 'pick-color': { const f = el.closest('form'); $$('.sw', f).forEach(b => b.setAttribute('aria-pressed', String(b === el))); f.querySelector('[name=color]').value = v; crewPreview(); break; }
    case 'pick-pattern': { const f = el.closest('form'); $$('[data-act=pick-pattern]', f).forEach(b => b.setAttribute('aria-pressed', String(b === el))); f.querySelector('[name=pattern]').value = v; crewPreview(); break; }
    case 'remove-cover': if(crewDraft){ if(crewDraft.src) URL.revokeObjectURL(crewDraft.src); crewDraft.file = null; crewDraft.src = ''; crewDraft.remove = true; el.hidden = true; $('#cr-cover-l').textContent = 'Add a photo'; crewPreview(); } break;
    case 'edit-crew': openEditCrew(); break;
    case 'pick-kind': { const f = el.closest('form'); $$('[data-act=pick-kind]', f).forEach(b => b.setAttribute('aria-pressed', String(b === el))); f.querySelector('[name=kind]').value = v; crewPreview(); break; }
    case 'invite': openInvite(); break;
    case 'view': view = v; store.set('kq-view', v); closeSheet(); render(); scrollTo(0, 0); break;
    case 'mailday': openMailDay(); break;
    case 'letters': openLetters(); break;
    case 'copy': try{ await navigator.clipboard.writeText(v); toast('Link copied.'); }catch(err){ const i = $('#inv-link'); if(i){ i.select(); } toast('Select the link and copy it.'); } break;
    case 'share': try{ await navigator.share({text:v}); }catch(err){} break;
    case 'snap': openSnap(); break;
    case 'stamp': openStamp(); break;
    case 'snap-place': if(!snapDraft) break; $$('#sn-place button').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
      snapDraft.place = v === 'auto' ? await analyzePlace(snapDraft.src) : {pos:v, ink:(snapDraft.place && snapDraft.place.ink) || 'light'}; snapPreview(); break;
    case 'stamp-mode': if(!stampDraft) break; stampDraft.mode = v; $$('[data-act=stamp-mode]').forEach(b => b.setAttribute('aria-pressed', String(b === el)));
      $('#st-gh').hidden = v !== 'github'; $('#st-photo').hidden = v !== 'photo'; if(v === 'photo'){ stampDraft.pick = null; } stampPreview(); break;
    case 'load-commits': loadCommits(); break;
    case 'pick-commit': pickCommit(v); break;
    case 'tray-pick': openStamp(v); break;
    case 'stamp-photo': openStamp(); { const b = $('[data-act=stamp-mode][data-v=photo]'); if(b) b.click(); } break;
    case 'open': openPost(id); break;
    case 'react': toggleReact(id, v, el); break;
    case 'delete': deletePost(id, el); break;
    case 'me': openMe(); break;
    case 'leave': leaveCrew(el); break;
  }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') closeSheet();
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches('.hit')){ e.preventDefault(); e.target.click(); }
  if(e.key === 'Enter' && e.target.id === 'st-repo'){ e.preventDefault(); loadCommits(); }
});
$('#scrim').addEventListener('click', e => { if(e.target === $('#scrim')) closeSheet(); });
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if(!f) return; e.preventDefault();
  ({crew:makeCrew, snap:postSnap, stamp:postStamp, me:saveMe, letter:sendLetter})[f.dataset.form](f);
});
document.addEventListener('input', e => {
  if(e.target.id === 'sn-text'){ const n = e.target.value.length, ct = $('#sn-count'); ct.textContent = `${n}/${SNAP_MAX}`; ct.classList.toggle('is-near', n >= SNAP_MAX - 10); snapPreview(); }
  if(['st-title', 'st-stat', 'st-unit'].includes(e.target.id)) stampPreview();
  if(e.target.id === 'cr-name') crewPreview();
  if(e.target.id === 'cr-hex'){ const f = e.target.closest('form'); $$('.sw', f).forEach(b => b.setAttribute('aria-pressed', String(b.classList.contains('sw-pick')))); f.querySelector('[name=color]').value = e.target.value; crewPreview(); }
});
document.addEventListener('change', async e => {
  if(e.target.id === 'cr-cover' && e.target.files[0] && crewDraft){
    if(crewDraft.src) URL.revokeObjectURL(crewDraft.src);
    crewDraft.file = e.target.files[0]; crewDraft.src = URL.createObjectURL(crewDraft.file); crewDraft.remove = false;
    $('#cr-cover-l').textContent = 'Change photo'; const rm = $('[data-act=remove-cover]'); if(rm) rm.hidden = false;
    const hex = await photoColor(crewDraft.src), f = e.target.closest('form');
    if(hex && f){ f.querySelector('[name=color]').value = hex; const hx = $('#cr-hex'); if(hx) hx.value = hex; $$('.sw', f).forEach(b => b.setAttribute('aria-pressed', String(b.classList.contains('sw-pick')))); }
    crewPreview();
  }
  if(e.target.id === 'sn-file' && e.target.files[0] && snapDraft){
    if(snapDraft.src) URL.revokeObjectURL(snapDraft.src);
    snapDraft.file = e.target.files[0]; snapDraft.src = URL.createObjectURL(snapDraft.file);
    $('#sn-photo-l').textContent = 'Change photo';
    snapDraft.place = await analyzePlace(snapDraft.src); snapPreview();
  }
  if(e.target.id === 'st-file' && e.target.files[0] && stampDraft){
    if(stampDraft.src) URL.revokeObjectURL(stampDraft.src);
    stampDraft.file = e.target.files[0]; stampDraft.src = URL.createObjectURL(stampDraft.file);
    $('#st-photo-l').textContent = 'Change image'; stampPreview();
  }
});

boot();
})();

</script>
</body>
